ay:flex;align-items:center;justify-content:center;gap:12px}.tabs button b{font-size:18px}.tabs button span{font-size:12px;font-weight:800;opacity:.75}.tabs button.active{background:#fff;color:var(--ink);box-shadow:inset 0 -3px var(--orange),0 4px 14px #806a4b20}.rounds{max-width:1040px;margin:0 auto 20px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.rounds button{border:1px solid #dccbb8;background:#fff;color:#5a6b7a;border-radius:999px;padding:9px 13px;font-weight:800;cursor:pointer}.rounds button b{color:var(--orange);margin-left:4px}.rounds button.active{background:var(--ink);color:#fff;border-color:var(--ink)}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding:8px 4% 40px}.mode{border:0;border-radius:26px;padding:28px 30px;text-align:left;cursor:pointer;position:relative;box-shadow:0 8px 0 #17324d1f;color:var(--ink);transition:.2s}.mode:hover{transform:translateY(-4px)}.mode.gold{background:#fff0bd}.mode.solo{background:#dcecff}.mode .icon{position:absolute;right:28px;top:23px;font-size:42px}.mode small{display:block;font-weight:900;margin-bottom:7px}.mode strong{display:block;font-size:29px}.mode p{line-height:1.6;color:#4c5e6e}.mode i{font-style:normal;font-weight:900}.quiz{min-height:100vh;background:#f6f1e8;padding-bottom:40px}.qtop{height:70px;background:var(--ink);color:#fff;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 4%;gap:10px}.qtop button{justify-self:start;border:1px solid #ffffff50;background:transparent;color:#fff;padding:9px 13px;border-radius:10px;cursor:pointer}.qtop span{justify-self:end;font-weight:900}.progress{height:8px;background:#ded6cb}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--yellow))}.picker{display:flex;gap:8px;align-items:center;max-width:900px;margin:20px auto -10px;padding:0 18px;font-size:13px;font-weight:800}.picker button{border:1px solid #d8cbbc;background:#fff;padding:7px 11px;border-radius:99px;cursor:pointer}.picker button.active{background:var(--ink);color:#fff}.card{max-width:900px;margin:32px auto 0;background:#fff;border-radius:28px;padding:35px 40px;box-shadow:0 14px 40px #6d59451c}.meta{display:flex;justify-content:space-between;margin-bottom:18px}.meta span{background:#ffeadf;color:#ba3d17;padding:7px 12px;border-radius:99px;font-size:13px;font-weight:900}.meta i{font-style:normal;font-size:12px;color:#698091}.card h2{font-size:clamp(24px,3.4vw,36px);line-height:1.42;margin:0 0 22px}.card h2 small{display:block;color:var(--orange);font-size:16px;margin-bottom:7px}.context{background:#fff8e7;border-left:5px solid var(--yellow);padding:16px 18px;border-radius:0 13px 13px 0;line-height:1.65;font-weight:700;margin-bottom:20px}.choices{display:grid;gap:10px}.choice{min-height:66px;display:flex;align-items:center;gap:14px;border:2px solid #d9cdbf;background:#fff;padding:14px 18px;border-radius:14px;text-align:left;font-size:18px;font-weight:800;line-height:1.5;letter-spacing:-.01em;color:var(--ink);cursor:pointer}.choice b{flex:0 0 auto;font-size:24px;font-weight:950;color:#52708a}.choice span{font-weight:800}.choice.selected{border-color:var(--blue);background:#eef6ff}.choice.correct{border-color:var(--green);background:#eafaf3}.choice.wrong{border-color:#e14949;background:#fff0f0}.choice em{margin-left:auto;background:var(--green);color:#fff;font-style:normal;font-size:12px;font-weight:900;padding:5px 9px;border-radius:99px}.submit,.next,.results button{border:0;border-radius:14px;padding:15px 22px;font-weight:900;cursor:pointer}.submit{width:100%;margin-top:20px;background:var(--orange);color:#fff}.submit:disabled{background:#d9d5d0;color:#918b84}.explain{margin-top:22px;border-top:2px dashed #e8ded2;padding-top:20px}.verdict{font-size:20px;font-weight:900;color:var(--green);margin-bottom:15px}.verdict.no{color:#d74242}.explain h3{font-size:19px;font-weight:900}.explain p{font-size:17px;line-height:1.8;font-weight:800;color:#294760;letter-spacing:-.01em}.next{display:block;margin-left:auto;background:var(--ink);color:#fff}.question-preview{min-height:210px;display:grid;place-content:center;text-align:center;gap:12px;border:3px dashed #f0c49f;border-radius:20px;background:#fff8ed;color:#52677a}.question-preview span{font-size:18px;font-weight:800}.question-preview b{font-size:26px;color:var(--orange)}.question-preview strong{display:grid;place-items:center;width:82px;height:82px;margin:2px auto 0;border-radius:50%;background:var(--orange);color:#fff;font-size:48px;font-weight:950;box-shadow:0 8px 18px #ff6b3540;animation:pulse .9s ease infinite}.shortcut{text-align:center;color:#71808e;font-size:13px}.result{max-width:610px;margin:55px auto;background:#fff;border-radius:28px;padding:42px;text-align:center}.trophy{font-size:65px}.ring{width:145px;height:145px;margin:20px auto;border:12px solid #ffe0c8;border-top-color:var(--orange);border-radius:50%;display:flex;align-items:baseline;justify-content:center;padding-top:35px}.ring b{font-size:48px;color:var(--orange)}.results{display:flex;gap:10px;justify-content:center;margin-top:24px}.results button{background:#edf0f2}.results .primary{background:var(--orange);color:#fff}footer{text-align:center;padding:24px;border-top:1px solid #ead7c2;color:#6d7d8a;font-weight:700}@media(max-width:720px){.home{padding:0 15px}.tag,.shield{display:none}.top{height:62px}.mark{width:40px;height:40px}.hero{grid-template-columns:1fr;padding:34px 4px 24px}.lead{font-size:16px}.stats{gap:5px}.stats span{padding:8px;font-size:10px}.tabs button{flex-direction:column;gap:3px;padding:11px 5px}.tabs button b{font-size:15px}.tabs button span{font-size:10px}.modes{grid-template-columns:1fr;padding:4px 0 28px}.mode{padding:24px}.qtop{height:62px;padding:0 12px}.qtop b{font-size:14px}.qtop button{font-size:11px}.card{margin:17px 11px 0;padding:23px 17px}.choice{min-height:62px;font-size:17px;padding:13px 12px;gap:11px}.choice b{font-size:23px}.explain p{font-size:16px;line-height:1.75}.result{margin:22px 11px;padding:30px 18px}.results{flex-direction:column}}

는 원인 중 나쁜 마음으로 일부러 불을 지르는 것은?","choices":["누전","불장난","부주의","방화"],"answer":3,"explanation":"고의로 불을 지르는 행위를 방화라고 합니다.","category":"기출문제","difficulty":"중"},{"id":25,"question":"주택화재 인명피해를 줄이기 위해 의무적으로 설치하는 것은?","choices":["소화기만","스프링클러만","옥내소화전","단독경보형감지기와 소화기"],"answer":3,"explanation":"주택용 소방시설은 단독경보형감지기와 소화기입니다.","category":"기출문제","difficulty":"중"}],"제18회":[{"id":1,"question":"불이 났을 때 대처하는 방법으로 적절하지 않은 것은 어느 것인가요?","choices":["불이야 라고 큰 소리로 외쳐 주위사람들에게 알린다.","불이 꺼지지 않으면 빨리 밖으로 나간다.","이불 속으로 숨어 화상을 입지 않도록 한다.","방에 갇혀 있을 때는 창문 밖으로 물건을 던지거나 수건이나 옷가지 등을 흔든다."],"answer":2,"explanation":"이불 속으로 숨게 되면 불이 옮겨 붙을 수 있고, 보이지 않아 구조가 어렵다.","category":"기출문제","difficulty":"중"},{"id":2,"question":"식당에서 뜨거운 국물에 데었을 때의 행동으로 바른 것은 어느 것인가요?","choices":["수돗물을 세게 틀어 빨리 식힌다.","진물이 흐르지 않게 붕대로 상처부위를 감는다.","가능하면 물집은 터트리지 않는다.","화상 정도와 상관없이 옷을 빨리 벗긴다."],"answer":2,"explanation":"수돗물을 세게 틀면 피부에 큰 손상을 줄 수 있고, 약솜이나 붕대는 상처에 달라붙을 수 있으며, 화상이 심할 경우 억지로 옷을 벗기지 않아야 한다.","category":"기출문제","difficulty":"중"},{"id":3,"question":"가스가 샐 때에 하는 행동 중 옳은 것은 어느 것인가요?","choices":["수건으로 코를 막고 화장실로 피한다.","창문을 열고 선풍기를 켜서 환기시킨다.","전등을 켜 가스가 어디에서 새는지 확인한다.","발견 즉시 점화스위치와 중간 밸브, 용기 밸브를 잠근다."],"answer":3,"explanation":"전등이나 선풍기 등을 키거나 끌 때 전기 불꽃이 생기면 새어나온 가스가 폭발할 수 있고, 수건으로 코를 막고 화장실로 대피하면 가스가 계속 새어나와 위험하므로 빨리 밖으로 대피하여 어른이나 119에 신고한다.","category":"기출문제","difficulty":"중"},{"id":4,"question":"다음 글에서 설명하는 불 끄는 방법은 무엇인가요? ( ) 공기 중에는 보통 21% 정도의 산소가 있으며, 산소가 15% 이하가 되면 불꽃은 꺼진다. 따라서 모래, 담요 등을 가지고 불에 타고 있는 물체를 완전히 덮어서 산소가 들어가지 못하도록 하면 불이 끌 수 있다.","choices":["냉각소화","제거소화","질식소화","소각소화"],"answer":2,"explanation":"질식소화는 공기 중에 있는 산소를 차단하여 불을 끄는 방법이다.","category":"기출문제","difficulty":"중"},{"id":5,"question":"다음 중 방화와 관련하여 법에 의해 처벌받는 사람을 모두 고르시오.","choices":["방화를 준비한 사람","불을 내려고 했으나 실패한 사람","방화를 보고 신고한 사람","방화범을 도와준 사람"],"answer":0,"explanation":"방화는 방화범은 물론이고, 불을 내려고 했으나 실패한 사람, 방화를 준비한 사람, 방화범을 도와준 사람까지 모두 법에 의해 벌을 받는다.","category":"기출문제","difficulty":"중"},{"id":6,"question":"고층 아파트에서 화재 발생 시 소화기 등으로 불이 꺼지지 않는 경우 가장 올바른 행동은 어느 것인가요?","choices":["당황하지 말고 침착하게 창문 밖으로 뛰어 내린다.","연기가 심할 경우 손수건을 물에 적셔 코를 막고 입으로만 숨을 쉬며 대피한다.","대피 시간을 단축하기 위해 엘리베이터를 이용한다.","아끼는 물건을 그대로 둔 채 재빨리 밖으로 대피한다."],"answer":3,"explanation":"고층에서 화재발생 시 창밖으로 뛰어내리는 것은 위험하며, 엘리베이터가 고장이 날 수 있으므로 계단을 이용하여야한다. 물에 젖은 수건을 입과 코 모두 감싸고 수건을 통해 간접적으로 숨을 쉬어야 한다.","category":"기출문제","difficulty":"중"},{"id":7,"question":"옷에 불이 붙으면 어떻게 해야 하는지를 가장 잘 설명한 것은 어느 것인가요?","choices":["손으로 신속히 불을 털어내려고 한다.","제자리에서 뛰면서 다른 사람에게 도움을 청한다.","천이 피부에 달라붙어 뜨거우니 옷을 벗으려고 애쓴다.","멈추고 바닥에 엎드려 얼굴을 가린 후 좌우로 구른다."],"answer":3,"explanation":"옷에 붙이 붙으면 손으로 털거나 울지 말고 빨리 엎드려 뒹군다. 차분하게 서서(stop), 바닥으로 엎드리고(drop), 손으로 얼굴을 가린 후 좌우로 구른다.(roll)","category":"기출문제","difficulty":"중"},{"id":8,"question":"119에 장난전화 하는 동생에게 잘못 말해주는 친구는 누구인가요?","choices":["민혁: 119로 장난전화를 하는 행동은 법에 의해 무서운 벌을 받게 되는 중대한 범죄야","동희: 119로 장난전화를 하여 소방차가 출동하게 되면, 같은 시각에 다른 곳에서 발생한 실제 화재현장에 늦게 출동하게 되어 큰 피해가 발생할 수 있어","희철: 소방서에 자꾸 장난 전화를 하게 되면, 정말로 긴급한 일로 전화한 사람들도 장난 전화로 오해를 받을 수 있어","가희: 장난전화를 하면 처벌받을 수 있기 때문에 우리 집 주소를 말해주면 안돼"],"answer":3,"explanation":"119에 장난전화 하는 경우에는 위치 추적이 되어 처벌받게 되므로 어떤 경우에도 장난전화를 걸어서는 안 된다.","category":"기출문제","difficulty":"중"},{"id":9,"question":"경보설비 중 감지기에 대한 설명이 아닌 것은 어느 것인가요?","choices":["천장에 설치되어 불이 난 것을 자동으로 감지한다.","열감지기와 연기감지기가 있다.","주택의 경우 주택용소방시설 중 단독경보형감지기는 선택적으로 설치할 수 있다.","단독경보형감지기는 전선의 연결 없이 집 천장에 붙이고 건전지를 넣어 사용한다."],"answer":2,"explanation":"주택의 경우 주택용소방시설(단독경보형감지기 및 소화기)을 의무적으로 설치해야 한다.","category":"기출문제","difficulty":"중"},{"id":10,"question":"소화설비에 대한 설명으로 틀린 것은 어느 것인가요?","choices":["소화기, 옥내소화전, 스프링클러 등이 있다.","옥내소화전을 작동시킬 때는 밸브를 시계방향으로 돌려 연다.","스프링클러는 건물 안의 천정이나 벽에 설치해 물이 소나기처럼 쏟아져 불을 끄도록 하는 설비이다.","소화기는 불이 처음 시작될 때나 작은 불일 경우 사람이 사용하여 불을 끄는 기구이다."],"answer":1,"explanation":"옥내소화전을 작동할 때는 밸브를 시계반대방향으로 돌리면 물이 나온다.","category":"기출문제","difficulty":"중"},{"id":11,"question":"종이로 불장난을 하다가 책상에 옮겨 붙어 발생한 불은 무엇인가요?","choices":["A급 화재","B급 화재","C급 화재","K급 화재"],"answer":0,"explanation":"종이, 책상, 옷, 나무, 천 등의 물건이 타는 것은 A급 화재에 해당된다.","category":"기출문제","difficulty":"중"},{"id":12,"question":"다음 글에서 설명하는 피난시설은 무엇인가요? ( ) 바닥으로부터 1m높이 이하에 설치되어 있고 피난통로가 되는 복도, 계단 등에 설치하여 피난구의 방향을 표시하는 피난시설","choices":["피난구 유도등","피난계단","피난사다리","통로 유도등"],"answer":3,"explanation":"피난구 유도등은 출입구 위에 설치되어 있다.","category":"기출문제","difficulty":"중"},{"id":13,"question":"방화문에 대한 설명 중 옳지 않은 것은 어느 것인가요?","choices":["다른 곳으로 화재가 확산되는 것을 막아준다.","대피를 위한 비상구 역할을 한다,","방화문은 수시로 열 수 있으나 항상 열린 상태를 유지해야 한다.","방화문 주변에는 물건 등을 두지 말아야 한다."],"answer":2,"explanation":"방화문은 수시로 열 수 있으나 항상 닫힌 상태를 유지해야 한다.","category":"기출문제","difficulty":"중"},{"id":14,"question":"다음 중 피난시설이 아닌 것은 어느 것인가요?","choices":["구조대","통로 유도표지","옥외소화전","완강기"],"answer":2,"explanation":"옥외소화전은 불을 끄는 소화설비에 해당한다.","category":"기출문제","difficulty":"중"},{"id":15,"question":"다음 글에서 설명하는 피난시설은 것은 어느 것인가요? ( ) 3층 이상의 아파트에서 외부로 긴급하게 뛰어내릴 때 안전하게 땅에 도달할 수 있도록 공기를 넣어 사용하는 피난기구","choices":["구조대","공기안전매트","피난사다리","완강기"],"answer":1,"explanation":"공기안전매트는 3층 이상의 아파트에서 외부로 긴급하게 뛰어내릴 때 안전하게 땅에 도달할 수 있도록 공기를 넣어 사용하는 피난기구이다.","category":"기출문제","difficulty":"중"},{"id":16,"question":"화학약품에 의한 화상 시 응급처치 요령으로 잘못된 것은 무엇인가요?","choices":["상처가 크고 진물이 날 경우 비상약품을 바르고 붕대로 여러 겹 감아 병원으로 간다.","응급처치를 하는 사람은 고무장갑을 끼거나 두꺼운 수건으로 손을 잡고 환자를 다루어야 한다.","옷을 제거해야 하는 경우에는 벗기지 말고 가위로 잘라낸다.","흐르는 차가운 물로 상처 부위의 화학약품을 모두 씻어낸다."],"answer":0,"explanation":"화상 상처가 깊은 경우 아무것도 바르지 말고, 깨끗하고 마른 천으로만 덮어 병원으로 가서 치료를 받는다. 이 때 붕대를 감으면 상처 부위에 달라붙어 치료에 어려울 수 있다.","category":"기출문제","difficulty":"중"},{"id":17,"question":"학교화재 시 대피 후 행동요령으로 알맞지 않은 것은 어느 것인가요?","choices":["교실로 다시 들어가지 않는다.","운동장 등 안전한 곳으로 대피한 후 친구가 있는지 확인한다.","친구가 안보이면 선생님이나 소방관에게 말씀드린다.","선생님의 지시가 있을 때까지 안전한 곳에 흩어져서 기다린다."],"answer":3,"explanation":"대피 후 선생님의 지시가 있을 때까지 흩어지지 말고 모여 있어야 인원파악 등 긴급하게 대처하기가 쉽다.","category":"기출문제","difficulty":"중"},{"id":18,"question":"건물 붕괴 시 대피하는 방법으로 알맞지 않은 것은 어느 것인가요?","choices":["당황하지 말고 주변을 살피며 대피로를 찾는다.","유리창, 선반 등 파손되기 쉬운 곳과 폭발성, 가연성 물건이 있는 곳은 피한다.","가방, 방석, 책 등 딱딱한 물건으로 머리를 보호하면서 일시에 비상구로 몰리지 않도록 침착하게 이동한다.","긴급하여 탈출이 곤란한 경우 장애물이 없는 거실 등 넓은 곳으로 대피한다."],"answer":3,"explanation":"긴급하여 탈출이 곤란할 경우 엘리베이 ices":["황사","홍수","태풍","장마"],"answer":1,"explanation":"홍수에 대한 설명이다.","category":"기출문제","difficulty":"중"}],"제19회":[{"id":1,"question":"다음 글에서 설명하는 화재의 원인은 어느 것인가요? ( ) 음식물 조리 중 깜빡 잊어버려 화재 발생 담뱃불을 다 끈 줄 알고 휴지통에 버렸는데 화재 발생 옷을 다리던 중 다리미를 옷 위에 올려놓고 깜빡 잊어버려 화재 발생","choices":["누전","방화","부주의","불장난"],"answer":2,"explanation":"화재의 원인에는 부주의, 전기적 요인, 기계적 요인, 방화 등이 있다.","category":"기출문제","difficulty":"중"},{"id":2,"question":"다음 중 방화에 대한 설명으로 올바른 것은 어느 것인가요?","choices":["어린이들의 놀이에 의해 주로 발생한 화재이다.","전체 화재에서 가장 많은 부분을 차지한다.","방화를 저지른 자는 징역 또는 벌금에 처하지 않는다.","어른들이 싸우다가 화가 나서 불을 내는 것도 방화이다."],"answer":3,"explanation":"화재원인 중 가장 큰 원인이 부주의이다. 방화를 저지른 자는 경중에 따라 징역 또는 벌금형에 처할 수 있다.","category":"기출문제","difficulty":"중"},{"id":3,"question":"연소 후 재를 남기는 종류의 화재로써 나무, 천, 종이 등으로 만들어진 물건이 타는 화재는 어느 것인가요?","choices":["A급 화재","B급 화재","C급 화재","K급 화재"],"answer":0,"explanation":"A급 화재(일반가연물화재)는 연소 후 재를 남기는 종류의 화재이다.","category":"기출문제","difficulty":"중"},{"id":4,"question":"다음은 화상의 정도에 따른 분류 중 하나입니다. 어느 정도의 화상에 대한 내용인가요? ( ) 피부가 빨갛게 변하고 약간 부어오른다. 치료 후에는 상처가 남지 않고 보통 1주일 이내에 낫는다.","choices":["1도 화상","2도 화상","3도 화상","4도 화상"],"answer":0,"explanation":"1도화상(표면층 화상)에 대한 설명이다.","category":"기출문제","difficulty":"중"},{"id":5,"question":"하나의 콘센트에 많은 전기기구를 연결하여 전선의 허용전류를 초과할 때 발생하는 것은 어느 것인가요?","choices":["누전","합선","과전류","접촉불량"],"answer":2,"explanation":"하나의 콘센트에 많은 전기기구를 연결해 사용하면 콘센트나 연결전선에서 허용하는 전류를 초과하게 되는 것을 과전류라 한다.","category":"기출문제","difficulty":"중"},{"id":6,"question":"가스가 새는 것을 감지하여 자동적으로 경보를 울리는 장치의 이름은 어느 것인가요?","choices":["가스 수신기","가스 감지기","가스 누설 경보기","가스 차단 스위치"],"answer":2,"explanation":"가스 누설 경보기는 가스가 새면 부저 경보를 울리고 배관에 설치된 차단밸브를 작동하여 가스 공급을 중단한다.","category":"기출문제","difficulty":"중"},{"id":7,"question":"소화기 사용법에 대한 바른 순서는 어느 것인가요? ( ) ㉠ 안전핀을 뽑는다. ㉡ 소화기를 불이 난 곳으로 옮긴다. ㉢ 바람(실외)을 등지거나 출입문(실내)을 등지고 호스를 불쪽으로 향한다. ㉣ 손잡이를 힘껏 움켜쥐고, 빗자루로 쓸 듯이 골고루 뿌린다.","choices":["㉠-㉡-㉢-㉣","㉡-㉠-㉢-㉣","㉢-㉠-㉡-㉣","㉣-㉠-㉡-㉢"],"answer":1,"explanation":"소화기를 불이 난 곳으로 이동 → 안전핀을 뽑는다 → 바람을 등지고 호스를 불쪽으로 향한다 → 빗자루로 쓸 듯이 골고루 뿌린다.","category":"기출문제","difficulty":"중"},{"id":8,"question":"불이 나면 건물 안의 천장이나 벽에 설치해 놓은 기구를 통해 자동으로 물이 소나기처럼 쏟아져 불을 끄도록 만든 설비는 어느 것인가요?","choices":["물소화기","스프링클러","분말소화기","옥내소화전"],"answer":1,"explanation":"스프링클러는 자동으로 물이 소나기처럼 쏟아져 불을 끄도록 만든 설비이다.","category":"기출문제","difficulty":"중"},{"id":9,"question":"상황에 따른 안전수칙으로 바르지 않은 것은 어느 것인가요?","choices":["지하철을 타면 비상용단추(비상통화장치)나 소화기가 어디에 있는지 위치를 확인한다.","백화점 화재 시 화재가 발생한 방향으로 대피한다.","극장에 갈 때에는 비상구가 어디에 있는지 확인한다.","불이 나면 안내원의 지시에 따라 차분하고 신속하게 대피한다."],"answer":1,"explanation":"화재 시 화재 반대 방향으로 대피해야 한다.","category":"기출문제","difficulty":"중"},{"id":10,"question":"화상을 입었을 때 대처 방법으로 바른 것은 어느 것인가요?","choices":["혈액순환을 위해 얼음찜질을 한다.","피부가 벗겨졌을 경우에는 붕대로 감는다.","화상이 심할 경우에는 옷이나 양말을 반드시 벗긴다.","큰 화상이 아니라면 찬물에 담그거나 수돗물에 식힌다."],"answer":3,"explanation":"피부가 벗겨지거나 진물이 흐를 경우에는 붕대가 상처에 달라붙을 수 있기 때문에 붕대를 감으면 안 된다.","category":"기출문제","difficulty":"중"},{"id":11,"question":"지진이 일어났을 때 행동요령으로 바르지 않은 것은 어느 것인가요?","choices":["담 근처로 대피한다.","차를 타고 있을 때는 손잡이를 꽉 잡는다.","학교에서는 건물 근처보다는 운동장 가운데로 대피한다.","야외에 있을 때는 가방 등의 소지품으로 머리를 보호한다."],"answer":0,"explanation":"담벼락이 무너질 수 있으므로 담벼락 근처에 있으면 안 된다.","category":"기출문제","difficulty":"중"},{"id":12,"question":"지하철 열차 화재 시 대피 방법을 바르게 설명한 것은 어느 것인가요?","choices":["지하철 밖으로 나간다.","반드시 지하철 통로를 통해 다음 역으로 이동한다.","안내 방송이 나올 때까지 지하철 안에서 대기한다.","계단을 통해 대피할 때 뒷사람이 앞사람을 밀어준다."],"answer":0,"explanation":"지하철 열차 화재 시에는 객실에 위치한 비상용 단추를 누르거나 119에 화재 신고를 한 다음, 신속하게 출입문을 열고 지하철 밖으로 나간다.","category":"기출문제","difficulty":"중"},{"id":13,"question":"다음에서 설명하는 화재는 어느 것인가요? ( ) 불이 붙기 쉽다. 이 화재로 발생한 증기는 공기보다 무겁다. 물보다 가볍고, 물과 섞이지 않으며 물로는 이 화재를 끄기가 어렵다.","choices":["가스화재","산불화재","유류화재","전기화재"],"answer":2,"explanation":"유류화재에서 나오는 유증기는 공기보다 무겁다.","category":"기출문제","difficulty":"중"},{"id":14,"question":"피난시설에 대한 설명으로 바르지 않은 것은 어느 것인가요?","choices":["유도등 : 전기전원이 끊어질 경우 작동을 안 한다.","방화문 : 항상 닫힌 상태를 유지해야 한다.","피난계단 : 물건을 쌓아두면 안 된다.","피난사다리 : 불길이 있어 문을 통해 밖으로 나갈 수 없을 때 창문을 통해 내려갈 수 있게 해준다."],"answer":0,"explanation":"유도등은 전기전원이 끊어질 경우 자체 축전지에 의해 20분 이상 작동한다.","category":"기출문제","difficulty":"중"},{"id":15,"question":"가스 누설 시의 응급조치 요령으로 바르지 않은 것은 어느 것인가요?","choices":["가스밸브를 잠근다.","창문을 열고 환기시킨다.","어른에게 알리거나 119에 신고한다.","전기기구를 사용하는 것은 괜찮다."],"answer":3,"explanation":"스위치를 켜거나 끌 때 전기불꽃이 생기면 새어나온 가스가 폭발하면서 불이 날 위험성이 있다.","category":"기출문제","difficulty":"중"},{"id":16,"question":"소화방법 중 질식소화는 공기 중의 산소 농도를 몇 % 이하로 만들어서 불을 끄는 것인가요?","choices":["15%","20%","25%","35%"],"answer":0,"explanation":"공기 중에 산소가 15% 이하가 되면 불꽃이 꺼진다.","category":"기출문제","difficulty":"중"},{"id":17,"question":"미세먼지가 심한 날 대처 방법으로 옳지 않은 것은 어느 것인가요?","choices":["외출을 자제한다.","외출 시 마스크를 착용한다.","창문을 열어 두어 환기를 시킨다.","외출 후에는 코와 손을 잘 씻는다."],"answer":2,"explanation":"미세먼지가 심한 날은 외출을 자제하고 외출 시 마스크를 착용한다.","category":"기출문제","difficulty":"중"},{"id":18,"question":"산불에 대한 설명으로 바른 것은 어느 것인가요?","choices":["주택가로 확산이 안 된다.","습도 25% 이하에서 주로 발생한다.","우리나라에서는 주로 여름철에 발생한다.","사람에 의한 실화 및 방화, 자연적인 낙뢰 등이 원인이다."],"answer":3,"explanation":"산불의 원인으로는 사람에 의한 실화 및 방화, 자연적인 낙뢰 등이 있다.","category":"기출문제","difficulty":"중"},{"id":19,"question":"소방시설 중에서 불이 난 것을 알려주는 경보설비는 어느 것인가요?","choices":["발신기","소화기","옥내 소화전","스프링클러"],"answer":0,"explanation":"불이 났을 때 사람이 단추를 눌러 불이 났다는 것을 알리도록 해주는 기구는 발신기이다.","category":"기출문제","difficulty":"중"},{"id":20,"question":"과학실험 중 화학약품에 의해 화상을 입었을 때 대처하는 방법으로 바른 것은 어느 것인가요?","choices":["무조건 빨리 옷을 벗긴다.","뜨거운 물로 상처 부위의 화학약품을 씻어 낸다.","응급처치 하는 사람은 맨손으로 환자를 다루어야 한다.","상처에 아무것도 바르지 말고, 깨끗하고 마른 천으로 덮어 병원에 가서 치료를 받아야 한다."],"answer":3,"explanation":"상처에 아무것도 바르지 않고, 깨끗하고 마른 천으로 덮어 병원에 가서 치료를 받는다.","category":"기출문제","difficulty":"중"},{"id":21,"question":"우리 집 안전수칙으로 바르지 않은 것은 어느 것인가요?","choices":["가스 기구의 밸브를 잠그는 습관을 가진다.","라이터나 촛불 등으로 불장난을 해서는 안 된다.","외출할 때는 난로 등을 꼭 끄고 나간다.","전기기구에서 타는 냄새가 나거나 연기가 나면 전원 플러그나 전기 스위치를 만지지 않는다."],"answer":3,"explanation":"전기기구에서 타는 냄새가 나거나 연기가 나면 빨리 전원 플러그를 뽑거나 전기 스위치를 꺼야 한다.","category":"기출문제","difficulty":"중"},{"id":22,"question":"건물 붕괴 시 대피방법에 대한 설명으로 바르지 않은 것은 어느 것인가요?","choices":["유리창, 선반 등 파손되기 쉬운 곳은 피한다.","당황하지 말고 주변을 살피며 대피로를 찾는다.","빨리 비상구로 뛰어가야 하므로 머리를 보호하지 않아도 된다.","긴급하여 탈출이 곤란한 경우에는 계단실 등과 같이 견디는 힘이 강한 벽체가 있는 곳으로 일단 대피한다."],"answer":2,"explanation":"비상구로 대피할 경우에도 머리는 보호해야 한다.","category":"기출문제","difficulty":"중"},{"id":23,"question":"학교 화재 시 대피 후 해야 할 행동으로 알맞지 않은 것은 어느 것인가요?","choices":["교실로 다시 들어가지 않는다.","친구가 안 보이면 다른 친구와 함께 찾으러 간다.","운동장 등 안전한 곳으로 대피한 후 친구가 있는지 확인한다.","선생님의 지시가 있을 때까지 흩어지지 않고 모여 있도록 한다."],"answer":1,"explanation":"친구가 보이지 않으면 선생님이나 소방관께 이야기 한다.","category":"기출문제","difficulty":"중"},{"id":24,"question":"물놀이 사고 발생 시 대처방법으로 바른 것은 어느 것인가요?","choices":["크게 소리를 질러 다른 사람에게 알린다.","흐르는 물에 빠졌을 때는 잠수해서 물 밖으로 나온다.","물에 빠진 사람을 발견하면 직접 물에 뛰어 들어서 구조한다.","수영에 자신 있는 사람은 구조 경험이 없어도 위험하지 않으므로 직접 구조한다."],"answer":0,"explanation":"구조 경험이 없는 사람이 함부로 물에 뛰어 들면 위험할 수 있으므로 절대 해서는 안된다.","category":"기출문제","difficulty":"중"},{"id":25,"question":"전기에 감전된 사람을 발견했을 때 취해야 할 올바른 행동이 아닌 것은 어느 것인가요?","choices":["전기 스위치를 꺼 전기를 차단한다.","119로 신고하여 구조를 요청한다.","감전된 사람에게 직접 손을 대 전기기구로부터 떨어뜨려 놓는다.","고무장갑이나 나무막대를 이용해 감전된 사람을 전기기구로부터 떼어 놓는다. 안전지킴이 여러분! 재난예방을 늘 실천하세요."],"answer":2,"explanation":"감전된 사람을 직접 만지면 만진 사람도 감전될 수 있다.","category":"기출문제","difficulty":"중"}],"제22회":[{"id":1,"question":"다음 그림은 최근 5년간 화재가 발생하는 원인을 통계로 나타낸 것입니다. 화재가 나는 원인 중 가장 많은 것은 어느 것입니까?","choices":["기계적요인","전기적요인","부주의","화학적요인"],"answer":2,"explanation":"부주의 는 화재가 일어나는 원인으로 가장 많습니다.","category":"기출문제","difficulty":"중"},{"id":2,"question":"하나의 콘센트에 여러 전기를 꽂아 사용하면, 적정용량을 초과하게 되는 과부하 에 걸려 지나치게 높은 열이 발생할 수 있습니다. 이것을 무엇이라고 할까요?","choices":["전기불꽃(스파크)","과열","감전","누전"],"answer":1,"explanation":"하나의 콘센트에 텔레비전, 전기밭솥, 다리미 등 여러 전기를 꽂아 사용하면, 적정용량을 초과하게 되는 과부하 에 결려 지나치게 높은 열이 발생할 수 있는데, 이를 과열 이라고 한다.","category":"기출문제","difficulty":"중"},{"id":3,"question":"다음 중 전기화재 예방법을 올바르게 실천하는 친구는 누구인가요?","choices":["상현: 누전차단기를 매월 1회 정기적으로 점검해야해","유리: 고장 난 전기제품을 내가 직접 고치려고 노력해","영진: 전선은 눈에 보이지 않게 가구나 문 아래 숨겨두는 게 좋아","예은: 플러그를 뽑을 때는 전깃줄을 힘껏 잡아당겨야해"],"answer":0,"explanation":"누전차단기는 고장 나지 않고 잘 작동하는지 매월 1회 이상 정기적으로 점검한다.","category":"기출문제","difficulty":"중"},{"id":4,"question":"다음은 가스화재 예방을 위한 설명이다. ( )안에 들어갈 말을 바르게 짝지은 것은 어느 것입니까? ( ) 가스 사용 후에는 ( )와 ( )를 반드시 잠가야 한다.","choices":["중간밸브, 메인 밸브","중간밸브, 공기 조절기","중간밸브, 점화스위치","중간밸브, 가스 누설 경보기"],"answer":2,"explanation":"가스 사용 후에는 중간밸브와 점화스위치를 반드시 잠가야 한다.","category":"기출문제","difficulty":"중"},{"id":5,"question":"산불은 습도와 아주 밀접한 관계가 있다고 합니다. 산불이 상당한 기세로 급속히 연소할 위험성이 있는 기준은 다음 중어느 것입니까?","choices":["60% 이상","50 ~ 60 %","40 ~ 50%","40% 이하"],"answer":3,"explanation":"산불은 기상조건 중 강우량, 바람, 습도,온도의 영향을 받지만 특히 습도가 40%이하일 때는 급속도로 번진다.","category":"기출문제","difficulty":"중"},{"id":6,"question":"화재가 발생했을 때 물로 불을 끌 수 없는 불이 있는데, 물로 끄면 안 되는 상황으로 틀린 것은 어떤 경우입니까?","choices":["기름을 사용하는 석유난로나 기구에 불이 났을 때","정원에 있는 나무에 불이 붙어 불이 났을 때","부엌에서 식용유로 이용하여 요리하던 중 불이 붙었을 때","전기기구를 사용 중에 열이 발생하여 불이 붙었을 때"],"answer":1,"explanation":"정원에 있는 나무에 불이 붙어 불이 났을 때는 물로 불을 꺼도 된다.","category":"기출문제","difficulty":"중"},{"id":7,"question":"화재가 났을 때 대처하는 방법으로 알맞은 것은 어느 것입니까?","choices":["중요한 게임기나 아끼는 물건을 들고 대피한다.","손수건이나 수건, 화장지 등을 물에 적셔서 코와 입을 가리고 자세를 최대한 낮추고 대피한다.","엘리베이터를 타고 아래층으로 재빨리 대피한다.","출입문을 열어두고 재빨리 대피한다."],"answer":1,"explanation":"불이 꺼지지 않으면 아끼는 물건을 가지고 나오거나 가구 방안에 숨으면 안된다. 대피할 때 손수건이나 수건, 화장지 등을 물에 적셔서 코와 입을 가리고 자세를 최대한 낮추고 대피한다. 대피할 때에는 불이 나서 전기가 꺼지게 되면 엘리베이터 안에 갇힐 위험이 있으므로 엘리베이터를 타지 말고 계단이나 비상구로 재빨리 대피한다. 밖으로 나올 때에는 연기나 불길이 퍼지지 않도록 출입문을 닫고 재빨리 대피한다.","category":"기출문제","difficulty":"중"},{"id":8,"question":"다음은 옷에 불이 붙었을 때 차분하게 자리에서 대처하는 방법을 나타낸 것입니다. 순서대로 알맞은 순으로 나타낸 것은 어느 것입니까? ( ) ㉠ ㉡ ㉢","choices":["㉠-㉢-㉡","㉠-㉡-㉢","㉡-㉠-㉢","㉢-㉠-㉡"],"answer":0,"explanation":"옷에 불이 붙으면 손으로 털거나 울지 말고 빨리 엎드려 뒹구는 것이 중요하다. 차분하게 자리에 서서(STOP) 천천히 바닥으로 엎드리고(DROP) 손으로 얼굴을 가린 후 좌우로 구른다(ROLL). 주변에 있는 사람은 담요나 수건으로 구르는 사람을 덮어준다.","category":"기출문제","difficulty":"중"},{"id":9,"question":"불이 났을 때 119에 신고하는 방법으로 알맞지 않은 것은 어느 것입니까?","choices":["소방관 아저씨가 쉽게 찾을 수 있게 가까이에 있는 큰 건물 이름을 말하면 더 좋다.","침착하게 주소를 또박또박 알려 주어야 한다.","신고 후 대피하면 안 되므로 소방차가 올 때까지 기다린다.","신고 시에 불이 난 원인을 말해주면 도움이 된다."],"answer":2,"explanation":"불이 났을 때 안전한 곳으로 먼저 대피한 후 119에 신고한다.","category":"기출문제","difficulty":"중"},{"id":10,"question":"119에 장난 전화를 하는 경우 발생할 수 있는 일들로 알맞은 것은 어느 것입니까?","choices":["장난 전화에 출동하여 다른 곳에 발생한 실제 화재 현장에 늦게 출동하여 피해가 발생할 수 있다.","자주 장난 전화를 해야, 긴급한 일로 전화한 사람들이 장난 전화로 오해받지 않는다.","장난 전화를 하면 친절하게 출동해주신다.","어린이들은 장난 전화를 해도 너그럽게 용서를 받는다."],"answer":0,"explanation":"119로 장난 전화를 하는 행동은 중대한 범죄로 실제 화재 현장에 늦게 출동하여 큰 피해를 발생시킬 수 있으며, 반복적인 장난 전화로 긴급한 일로 전화하는 사람들까지 오해를 받아 피해를 볼 수 있다.","category":"기출문제","difficulty":"중"},{"id":11,"question":"화재가 난 층의 상층부에서의 피난 방법으로 알맞은 것은 어느 것입니까?","choices":["불이 난 장소의 층은 안전하게 나중에 피난한다.","고층 건축물에서는 수직 피난 이동 경로인 계단에서의 혼란을 최소화하기 위해 위험이 미치기 쉬운 층부터 순차적으로 피난할 수 있도록 한다.","불이 나지 않은 층은 소방관이 올 때까지 기다린다.","불이 난 층에서 제일 높은 층부터 안전하게 피난한다."],"answer":1,"explanation":"고층 건축물에서는 수직 피난 이동 경로인 계단에서의 혼란을 최소화하기 위해 위험이 미치기 쉬운 층부터 순차적으로 피난할 수 있도록 한다. 불이 시작된 층, 그 바로 위층, 연기의 전파 우려가 있는 최상층의 순으로 피난한다.","category":"기출문제","difficulty":"중"},{"id":12,"question":"화상을 입었을 때에는 어떻게 해야 할까요?","choices":["얼음을 이용하여 열을 식힌다.","찬물을 세게 틀어서 열을 식힌다.","약솜(탈지면)으로 상처 부위를 감싸준다.","피부가 벗겨지거나 진물이 흐르는 경우 붕대를 감지 말고 의사의 진찰을 받는다."],"answer":3,"explanation":"약솜은 상처에 달라붙기 때문에 화상에는 절대 사용하면 안 된다.","category":"기출문제","difficulty":"중"},{"id":13,"question":"다음 중 소화기의 올바른 관리법이 아닌 것은 어느 것입니까?","choices":["소화기 위에 물건을 올려놓지 않는다.","습기가 적고 햇빛이 없는 서늘한 곳에 둔다.","소화기는 넘어지지 않게 평평한 곳에 놓는다.","대피할 것을 고려하여 출입문과 떨어진 곳에 둔다."],"answer":3,"explanation":"소화기는 불이 나면 대피할 것을 고려하여 출입문 가까이에 둔다.","category":"기출문제","difficulty":"중"},{"id":14,"question":"다음 보기의 내용은 소화기 사용법입니다. 소화기 사용순서에 맞게 바르게 짝지은 것은 어느 것입니까? ( ) ㉠ 소화기를 불이 난 곳으로 옮긴다. ㉡ 바람(실외)을 등지거나 출입문(실내)을 등지고 호스를 불쪽으로 향한다. ㉢ 손잡이 앞쪽 안전핀을 힘껏 뽑는다. ㉣ 손잡이를 힘껏 움켜쥐고, 빗자루로 쓸 듯이 골고루 뿌린다.","choices":["㉠-㉡-㉢-㉣","㉠-㉢-㉡-㉣","㉣-㉢-㉡-㉠","㉠-㉡-㉣-㉢"],"answer":1,"explanation":"소화기를 불이 난 곳으로 옮긴다.→손잡이 앞쪽을 보면 안전핀이 있는데 안전핀을 힘껏 뽑는다.→바람(실외)을 등지거나 출입문(실내)을 등지고 호스를 불쪽으로 향한다.→손잡이를 힘껏 움켜쥐고, 불을 향해 빗자루로 쓸 듯이 골고루 뿌린다.","category":"기출문제","difficulty":"중"},{"id":15,"question":"다음 설명한 것은 피난설비 중 무엇을 설명한 것입니까? ( ) 이것은 화재가 발생했을 때 다른 곳으로 화재가 확산되는 것을 막고 대피를 하기 위한 비상구 역할을 합니다. 이것은 수시로 열 수 있으나 항상 닫힌 상태를 유지해야 하며, 이것 주변에는 물건 등을 두지 말아야 합니다.","choices":["베란다문","현관문","교실문","방화문"],"answer":3,"explanation":"피난설비 중 방화문에 관한 설명입니다.","category":"기출문제","difficulty":"중"},{"id":16,"question":"학교 화재 시 대피 후 행동 요령으로 가장 알맞은 것은 어느 것입니까?","choices":["평소 익숙한 교실로 다시 들어간다.","친구가 안 보이면 선생님이나 소방관께 말씀드린다.","친한 친구끼리 흩어져 있는 것이 좋다.","친구가 안전한 곳으로 대피했는지 관심을 갖지 않는다."],"answer":1,"explanation":"교실로 다시 들어가지 말고 선생님의 지시가 있을 때까지 모여 있어야 하며, 운동장 등 안전한 곳으로 대피한 후 친구가 있는지 확인한다.","category":"기출문제","difficulty":"중"},{"id":17,"question":"화학약품을 사용하다 화상을 입었을 때 응급처치를 해야할 방법과 거리가 먼 것은 어느 것입니까?","choices":["어른에게 도움을 청하여 응급처치를 받는다.","흐르는 차가운 물로 상처 부위의 화학약품을 모두 씻어 낸다.","옷을 제거해야 하는 경우에는 있는 힘껏 뜯어서 벗겨야 한다.","상처에 아무것도 바르지 말고, 깨끗한 마른 천으로 덮어 병원에 가서 치료를 받아야 한다."],"answer":2,"explanation":"옷을 제거해야 하는 경우에는 벗기지 말고 가위로 잘라야 한다.","category":"기출문제","difficulty":"중"},{"id":18,"question":"온 가족이 지켜야 할 화재안전수칙으로 알맞지 않은 것은 어느 것입니까?","choices":["온 가족이 모여 화재 시 대피계획을 세우고 대피 훈련을 해본다.","음식물 조리도중 식재료가 없을 경우에는 마트에 식재료 사러 갔다 온다.","컴퓨터, 냉장고, 전기난로 등 전기기구에서 타는 냄새가 나거나 연기가 나면 빨리 전원 플러그를 뽑거나 전기 스위치를 끈다.","난로 등 열기구가 켜져 있는 상태에서 학원에 가거나 외출해서는 안 된다."],"answer":1,"explanation":"음식물 조리도중 자리를 비울 때 화재가 많이 발생하므로 조리중에는 자리를 지켜야 한다.","category":"기출문제","difficulty":"중"},{"id":19,"question":"다음 중 건물 붕괴시 대피방법으로 올바른 것은 어느 것입니까?","choices":["유리창, 선반, 등 파손되기 쉬운 곳과 폭발성, 가연성 물건이 있는 곳은 피해야 한다.","가방, 책, 방석 등 딱딱한 물건으로 머리를 보호하면서 대피하는 사람이 많을 때 일시적으로 한 비상구로 피해야 한다.","긴급하여 탈출이 곤란한 경우에는 엘리베이터를 타고 신속히 대피한다.","추가 붕괴와 가스 폭발 등의 위험이 있는 경우에는 건물 안에 숨는다."],"answer":0,"explanation":"가방, 책, 방석 등 딱딱한 물건으로 머리를 보호하면서 대피하는 사람이 많을 때 일시적으로 비상구로 몰리지 않도록 침착하게 대피한다. 긴급하여 탈출이 곤란한 경우에는 엘리베이터홀, 계단실 등과 같이 견디는 힘이 강한 벽체가 있는 곳에서 일단 대피한다. 추가 붕괴와 가스 폭발 등의 위험이 있는 경우에는 신속히 건물 안에서 나와 안전한 곳에 대피한다.","category":"기출문제","difficulty":"중"},{"id":20,"question":"물놀이 중 친구가 물에 빠졌을 때 지켜야 할 사항으로 옳지 않은 것은 어느 것인가요?","choices":["주변 어른들이나 119에 신고한다.","수영을 할 수 있을 경우 물에 들어가 침착하게 구해낸다.","물에 뜨는 물체를 던지거나 막대, 끈을 이용한다.","물 밖에 나온 친구가 호흡이 없을 경우 심폐소생술을 한다."],"answer":1,"explanation":"구조경험이 없는 사람이 함부로 뛰어들면 본인도 위험할 수 있으므로 절대금물이다.","category":"기출문제","difficulty":"중"},{"id":21,"question":"백화점, 대형마트에서 지켜야 할 안전수칙으로 바른 것은 어느 것입니까?","choices":["에스컬레이터 이용 시 전후좌우로 움직이면서 이용하면 된다.","에스컬레이터에서는 진행 방향을 거슬러 타고, 손잡이 밖으로 머리를 내밀지 않는다.","전시물 및 진열대 모서리에 부딪히지 않도록 조심한다.","무빙워크를 타고 이동할 때는 진행 방향으로 걸으면서 타면 안전하다."],"answer":2,"explanation":"에스컬레이터 이용할 때는 옷이나 물건, 신발 끈, 고무샌들 등이 틈새에 끼이지 않도록 주의한다. 무빙워크나 에스컬레이터에서는 진행 방향을 거슬러 오르내리지 않고, 손잡이 밖으로 머리를 내밀지 않는다. 전시물 및 진열대 모서리에 부딪히지 않도록 조심한다.","category":"기출문제","difficulty":"중"},{"id":22,"question":"지진이 일어났을 때 행동요령으로 바르지 않은 것은 어느 것인가요?","choices":["좁은 길이나 담 근처로 대피한다.","차를 타고 있을 때는 손잡이를 꽉 잡는다.","학교에서는 건물 근처보다는 운동장 가운데로 대피한다.","야외에 있을 때는 가방 등의 소지품으로 머리를 보호한다."],"answer":0,"explanation":"담벼락이 무너질 수 있으므로 담벼락 근처에 있으면 안 된다.","category":"기출문제","difficulty":"중"},{"id":23,"question":"홍수가 일어났을 때 행동 요령으로 알맞지 않은 것은 어느 것입니까?","choices":["홍수가 일어나도 집에 있으면서 자신이 하고 싶은 일을 하면 된다.","산에 있을 때는 체온이 떨어지지 않도록 따뜻하게 옷을 입어야 한다.","도로에서는 홍수에 의하여 밀려온 물에 가까이 가지 않도록 주의한다.","흐르는 물에 들어가지 말고, 물이 흐르는 곳을 통과할 경우에는 돌이나 맨홀이 있는지 발 밑을 살피면 걸어가야 한다."],"answer":0,"explanation":"가정에서는 TV나 라디오를 통해 강수량 등 기상예보 및 홍수 상황을 잘 알아둬야 하고, 공공기관 안내자의 지시에 따라 대피한다. 저지대인 경우는 갑작스러운 홍수가 발생하면 놓은 곳으로 빨리 대피한다.","category":"기출문제","difficulty":"중"},{"id":24,"question":"다음 중 소방관이 하는 일이 아닌 것은 어느 것입니까?","choices":["소방시설이나 전기시설, 가스시설 등을 점검한다.","화재 예방에 필요한 것들을 가르쳐 주신다.","119구급활동으로 우리들의 생명을 여러 가지 위험이나 사고로부터 구해주기도 한다.","소화기와 소화전 등 화재진압을 위한 기구를 수리해준다."],"answer":3,"explanation":"소방관은 화재사고에 대비하기 위해 소방시설이나 전기시설, 가스시설 등을 점검하고 화재를 진압하며, 119구급활동으로 여러 가지 위험이나 사고로부터 구해주기도 한다. 화재 예방에 필요한 것들을 가르친다.","category":"기출문제","difficulty":"중"},{"id":25,"question":"다음 중 그 쓰임이 다른 것은 어느 것입니까?","choices":["스프링클러","소화기","소화전","발신기 안전지킴이 여러분! 재난예방을 늘 실천하세요."],"answer":3,"explanation":"소화설비에는 옥내소화전, 스프링클러, 소화기가 있다.","category":"기출문제","difficulty":"중"}],"제23회":[{"id":1,"question":"불이란 ( ) 가 ( ) 와 결합하여 ( ) 를 내면서 타는 현상을 의미합니다. 옳게 짝지어진 것은 어느 것입니까?","choices":["불, 공기, 연기","연료, 불, 열","탈물질, 산소, 빛","가연물, 공기, 연기"],"answer":2,"explanation":"p.8 // 불이란 (가연물, 연료, 탈 물질) + (산소, 공기)와 만나 (열과 빛)을 내면서 타는 현상이다.","category":"기출문제","difficulty":"중"},{"id":2,"question":"우리 주변에서 화재가 발생하는 요인 중 다음 상황에 해당하는 요인은 어느 것입니까? ( ) ㉠ 담배꽁초를 아무데나 버려서 발생하는 화재 ㉡ 안전장치 없이 용접작업을 할 때 발생하는 화재 ㉢ 음식물 조리중에 자리를 비울 때 발생하는 화재","choices":["부주의","전기적요인","기계적요인","방화"],"answer":0,"explanation":"p.10 // 부주의로 인한 불에 대한 예시에 해당한다.","category":"기출문제","difficulty":"중"},{"id":3,"question":"전기화재 예방 방법 중 옳지 않은 것은 어느 것입니까?","choices":["낡은 전기제품이나 하나의 콘센트에 여러 전기기구를 꽂아서 사용하지 않는다.","플러그를 뽑을 때는 전깃줄 부분이 아니라 플러그 몸체를 잡고 뽑아야 한다.","플러그, 배선 주위의 먼지에 불이 붙을 수 있다.","고장난 전기제품이 있을 때 사용하지 않고 분해해서 원인을 파악해야 한다."],"answer":3,"explanation":"p.13 // 고장이 난 전기제품이 있을 때는 함부로 분해하지 않고 어른들께 말씀드려 고칠 수 있도록 한다.","category":"기출문제","difficulty":"중"},{"id":4,"question":"감전사고 발생 시 대처 방법 중 옳지 않은 것은 어느 것입니까?","choices":["감전의 원인이 된 전기제품에 다시 손을 대지 않는다.","화상을 입었다면 흐르는 물로 화상 부위를 식혀야 한다.","감전된 사람이 의식이 있는지 즉각 손으로 두드려서 확인하고 119를 부른다.","가벼운 감전이더라도 병원에 가서 진찰받아야 한다."],"answer":2,"explanation":"p.14 // 감전된 사람을 직접 만지지 않습니다.","category":"기출문제","difficulty":"중"},{"id":5,"question":"가스 점검 방법에 대한 설명 중 옳지 않은 것은 어느 것입니까?","choices":["가스가 새는 상황이라면 즉시 가스 사용을 멈추고 준비된 촛불이나 전기제품을 사용한다.","비눗물을 가스 스위치, 호스, 밸브 등에 묻혀 점검할 때, 거품이 나면 가스가 새는 것이므로 즉각 사용을 멈춰야 한다.","판매 업소, 도시가스 회사, 소방서 등에 점검 요청을 하여 정기적으로 점검 받는다.","가스레인지 불꽃 구멍이 막히지 않도록 자주 청소한다."],"answer":0,"explanation":"p.18, 19 // 가스가 샐 때 전기기구를 만지거나 라이터 성냥 등을 작동시켜선 폭발의 위험이 있다.","category":"기출문제","difficulty":"중"},{"id":6,"question":"다음 중 방화로 처벌을 받는 사람을 모두 고른 것은 어느 것입니까? ( ) ㉠ 불을 내려고 했으나 실패한 사람 ㉡ 방화를 준비한 사람 ㉢ 방화범을 도와준 사람 ㉣ 일부러 불을 낸 사람","choices":["㉠, ㉣","㉠, ㉢, ㉣","㉡, ㉢, ㉣","㉠, ㉡, ㉢, ㉣"],"answer":3,"explanation":"p.26 // 방화를 저지른 사람(방화범), 불을 내려고 했으나 실패한 사람, 방화를 준비한 사람, 방화범을 도와준 사람 모두 법에 따라 처벌받는다.","category":"기출문제","difficulty":"중"},{"id":7,"question":"습도가 50% 미만인 날이 많아, 산불의 약 60% 정도가 발생하는 계절은 어느 것입니까?","choices":["봄","여름","가을","겨울"],"answer":0,"explanation":"p.28 // 산불의 약 60% 정도는 봄에 발생한다.","category":"기출문제","difficulty":"중"},{"id":8,"question":"소화방법에 대한 설명으로 ( ) 안에 들어갈 내용이 순서대로 옳게 적은 것은 어느 것입니까? ( ) 공기 중에는 보통 ( ) % 정도의 산소가 있으며, ( ) % 이하로 산소가 되면 불꽃은 꺼지게 된다. 이러한 소화법을 ( ) 라고 한다","choices":["21, 15, 질식소화","21, 18, 제거소화","21, 15, 제거소화","40, 21, 질식소화"],"answer":0,"explanation":"p.32 // 공기 중에 보통 21% 정도 산소가 있으며, 산소가 15% 이하가 되면 불꽃은 꺼진다. 이러한 소화법을 질식소화라고 한다.","category":"기출문제","difficulty":"중"},{"id":9,"question":"다음은 화재 발생에 따른 행동 요령으로 가장 올바른 것은 어느 것입니까?","choices":["전기 콘센트에서 불길이 솟아 물을 뿌렸다.","요리 도중 작은 불이 붙어 재빠르게 야채를 많이 집어넣고 뚜껑을 덮었다.","연기가 위로 올라가므로 엘리베이터를 타고 아래층으로 재빨리 내려간다.","주위 사람들이 알 수 있도록 불이야 라고 외치고, 출입문을 열어두어 연기가 나오도록 한다."],"answer":1,"explanation":"p.34 // 요리 도중 불이 붙었다면 뚜껑을 덮거나 야채를 한꺼번에 많이 넣는다.","category":"기출문제","difficulty":"중"},{"id":10,"question":"다음 화재 중 물로 진화하기에 가장 적절하지 않은 화재는 어느 것입니까?","choices":["낙엽에 담뱃불이 떨어져 발생한 산불","종이 상자 더미에 불이 붙은 화재","튀김요리를 하던 도중 콘센트에서 발생한 화재","성냥으로 촛불을 켜던 도중 불이 옮겨붙은 화재"],"answer":2,"explanation":"p.33 // 전기화재나 유류 화재는 물을 사용하게 되면 감전이 될 수 있다.","category":"기출문제","difficulty":"중"},{"id":11,"question":"연기 속 피난 시 행동 요령에 대한 설명 중 옳지 않은 것은 어느 것입니까?","choices":["물에 젖은 수건을 입과 코에 대고 피난한다.","마른 수건도 4겹이면 연기를 40% 정도 제거할 수 있다.","물에 젖은 수건은 자극성 가스나 일산화탄소도 제거할 수 있다.","화재 발생 시 실내의 열과 연기는 위에서 아래로 내려오므로 자세를 낮추며 대피한다."],"answer":2,"explanation":"p.41 // 일산화탄소는 물에 젖은 수건이나 마른 수건도 제거할 수 없다","category":"기출문제","difficulty":"중"},{"id":12,"question":"다음은 심폐소생술 행동 요령 단계입니다. 순서대로 옳게 적은 것은 어느 것입니까? ( ) 반응 확인 가슴압박 및 인공호흡 회복 자세 119 신고 및 자동심장충격기(AED) 요청 호흡 확인","choices":[", , , ,",", , , ,",", , , ,",", , , ,"],"answer":0,"explanation":"p.44 // 심폐소생술의 단계는 반응 확인 119 신고 및 AED 요청 호흡 확인 심장 압박 및 인공호흡 회복자세 이다","category":"기출문제","difficulty":"중"},{"id":13,"question":"압사사고 예방 요령에 대한 설명 중 옳지 않은 것은 어느 것입니까?","choices":["앞 사람과 간격을 유지하며 질서 있게 행동한다.","가방이 있는 경우 가방을 뒤로 메는 것이 좋다.","넘어졌을 경우 몸을 웅크려서 신체 부위를 보호하며, 최대한 빠르게 일어난다.","시끄러운 행사장에선 소리를 지르는 것보다 호루라기를 사용하는 것이 효과적이다."],"answer":1,"explanation":"p.48 // 가슴이 있는 경우 앞으로 메야 한다.","category":"기출문제","difficulty":"중"},{"id":14,"question":"다음 중 감지기에 대한 설명입니다. 옳지 않은 것은 어느 것입니까?","choices":["불이 난 것을 자동으로 감지하는 경보설비이다.","수신기로 신호를 보내 벨이 울리게 한다.","열을 감지하여 신호를 보내며, 연기를 감지하지 못한다.","단독경보형감지기는 전선의 연결 없이 건전지로 사용 가능하다."],"answer":2,"explanation":"p.50 // 감지기는 열감지기와 연기감지기로 구분된다.","category":"기출문제","difficulty":"중"},{"id":15,"question":"소화설비 중, 건물 안의 천장이나 벽에 설치해 자동으로 물이 소나기처럼 쏟아져 불을 끄도록 만든 이 설비의 이름으로 적절한 것은 어느 것입니까?","choices":["옥내소화전","스프링클러","감지기","포소화설비"],"answer":1,"explanation":"p.53 // 스프링클러에 대한 설명이다","category":"기출문제","difficulty":"중"},{"id":16,"question":"가스나 기름에 의해 일어나는 화재를 부르는 용어로 적절한 것은 어느 것입니까?","choices":["A급 화재","B급 화재","C급 화재","K급 화재"],"answer":1,"explanation":"p.54 // 가스나 기름에 의해 발생하는 화재는 B급 화재이다","category":"기출문제","difficulty":"중"},{"id":17,"question":"소화기에 대한 설명 중 옳지 않은 것은 어느 것입니까?","choices":["소화기 가스를 점검할 때는 압력 게이지의 바늘을 살핀다.","주방 화재를 대비하기 위해선 K급 소화기를 설치하는 것이 좋다.","작은 불이든 큰 불이든 소화기로 모든 불을 끌 수 있으므로 불을 다루는 장소에는 반드시 소화기를 설치해야 한다.","손잡이를 힘껏 쥐고, 불을 향해 빗자루로 쓸 듯이 뿌린다."],"answer":2,"explanation":"p.53 // 천장이나 벽에 붙은 불은 소화기를 사용해도 큰 소용이 없다.","category":"기출문제","difficulty":"중"},{"id":18,"question":"피난시설 및 설비에 대한 설명으로 옳지 않은 것은 어느 것입니까?","choices":["피난 계단에는 물건을 쌓아두어선 안 된다.","유도등은 비상시 대피할 수 있게 방향을 알려두는 표시등이다.","건물의 창에서 땅 위로 설치하여 미끄러져 내려오게 하는 자루 모양의 피난기구를 구조대라 한다.","방화문은 화재 발생 시 대피하는 비상구 역할로 주변에 물건을 두면 안 되고 항상 열린 상태를 유지해야 한다."],"answer":3,"explanation":"p.60 // 방화문은 항상 닫힌 상태를 유지해야 한다.","category":"기출문제","difficulty":"중"},{"id":19,"question":"공공장소 안전수칙에 대한 설명으로 알맞지 않은 것은 어느 것입니까?","choices":["극장에 출입 시 비상구가 어디에 있는지 확인한다.","대피 시 비상구를 찾기 위해 여러 방향으로 움직인다.","화재 시 안내요원의 지시에 따라 차분하고 신속하게 대피한다.","열차 내에서는 출입문 비상콕 위치와 사용법을 확인한다."],"answer":1,"explanation":"p.65 // 대피 때 우왕좌왕하지 않고 한 방향을 택하여 대피한다.","category":"기출문제","difficulty":"중"},{"id":20,"question":"붕괴된 건물에 갇힌 경우 대처 방법으로 옳지 않은 것은 어느 것입니까?","choices":["핸드폰으로 구조요청하고, 필요한 경우만 전원을 켠다.","규칙적으로 파이프나 벽을 두드리고 호루라기를 불어 자신의 위치를 알린다.","신체에 해로울 수 있는 먼지를 피하기 위해서 손수건이나 옷으로 코와 입을 가리고 몸을 최대한 움직이는 것이 좋다.","구조될 수 있다는 희망을 갖고 체온이 떨어지지 않도록 한다."],"answer":2,"explanation":"p.71 // 몸을 되도록 움직이지 않아야 한다.","category":"기출문제","difficulty":"중"},{"id":21,"question":"물놀이 안전 수칙으로 옳지 않은 것은 어느 것입니까?","choices":["나보다 어린 사고자를 발견하면 119에 신고 한 뒤 물에 뛰어들어서 사고자를 구조한다.","물을 아예 안 먹으려고 애쓰기보다는 체력 소모를 줄이더라도 편안한 상태를 유지하려 노력한다.","흐르는 물에 빠졌을 때는 물의 흐름에 따라 표류하여 비스듬히 헤엄쳐 나온다.","큰 파도가 덮칠 때는 깊이 잠수할수록 안전하다."],"answer":0,"explanation":"p. 74 // 사고자를 발견해도 물에 뛰어들면 본인도 위험하므로 금물이다","category":"기출문제","difficulty":"중"},{"id":22,"question":"자연재해에 따른 안전 수칙이 바르게 설명된 것은 어느 것입니까?","choices":["낙뢰 : 나무나 전신주 근처로 대피한다.","홍수: 흐르는 물에 들어가 물을 따라 이동한다.","황사: 되도록 자주 밖에 나간다.","태풍: 유리창이 흔들리지 않도록 테이프 등으로 고정한다."],"answer":3,"explanation":"p.86 // 태풍에 대한 설명이다","category":"기출문제","difficulty":"중"},{"id":23,"question":"다음은 산행 중 산불 대처 요령입니다. 옳은 것은 어느 것입니까? ( ) ㉠ 빠른 신고 ㉡ 초기 진화 ㉢ 신속 대피 ㉣ 침착 대응","choices":["㉡초기 진화는 큰 산불도 외투나 흙으로 덮어 끌 수 있다.","㉠빠른 신고는 119로만 해야 한다.","㉢신속 대피는 공기가 부족하여 불이 잘 번지지 않는 산불보다. 높은 장소로 이동해야 한다.","㉣침착 대응을 위해 주변의 탈 물질을 제거하고 낮은 자세로 엎드려야 한다."],"answer":3,"explanation":"p.82 // 침착 대응에 대한 설명이다.","category":"기출문제","difficulty":"중"},{"id":24,"question":"다음은 화재보험에 가입해야 하는 이유입니다. 옳은 것은 어느 것입니까?","choices":["날씨를 예측하여 자연재해로 인한 피해를 예방할 수 있다.","화재로 인한 손해 발생 시 도움을 받을 수 있다.","화재 신고를 받고, 사고 현장으로 소방관을 출동시켜준다.","모든 건물의 화재보험 가입이 의무이기에 해야 한다."],"answer":1,"explanation":"p.92 // 화재보험에 대한 설명이다.","category":"기출문제","difficulty":"중"},{"id":25,"question":"우리 집 화재 안전 체크리스트 문항을 만들고자 합니다. 문항으로 옳지 않은 것은 어느 것입니까?","choices":["전기선 코드에 손상된 부분이 있는지 확인한다.","여러 제품을 하나의 콘센트에 꽂아 한 번에 파악할 수 있도록 한다.","커튼 등 불에 탈 수 있는 물건은 전열기와 1.2M 이상 떨어져 있어야 한다.","외출할 때는 항상 가스 밸브와 전기 코드를 확인한다. 안전지킴이 여러분! 재난예방을 늘 실천하세요."],"answer":1,"explanation":"p.96 // 전기제품의 코드를 콘센트에 분산해서 꽂아 사용한다.","category":"기출문제","difficulty":"중"}],"제24회":[{"id":1,"question":"불의 세 가지 요소 중 모두 다른 요소끼리 짝지은 것은?","choices":["불꽃, 공기, 열원","탈 수 있는 물건, 연료, 열","산소, 열, 가연물","점화원, 가연물, 열"],"answer":2,"explanation":"p.8 // (불꽃,열,열원,점화원) (산소,공기) (불에 탈 수 있는 물건,연료,가연물)이 같은 요소에 해당한다.","category":"기출문제","difficulty":"중"},{"id":2,"question":"누전 차단기 점검 방법에 대해 바르게 설명하고 있는 친구의 이름은?","choices":["소윤: 고장 나지 않고 잘 작동하는 지 3개월에 한번씩 점검하면 되는 거야.","선경: 점검 할 때는 사용 중에 있는 TV, 컴퓨터를 끌 필요는 없어. 금방 확인할 수 있거든.","한별: 누전 차단기 아래에 있는 시험용 버튼을 살짝 누르면 되는 거야.","태림: 누전 차단기 왼쪽에 있는 스위치가 아래로 떨어지면 고장난 것이니 즉시 부모님께 말씀드려서 교체하는 것이 좋아."],"answer":2,"explanation":"p.13 // 매월 1회이상 점검하고, 사용 중에 있는 TV는 꺼야 한다. 누전 차단기 왼쪽에 있는 스위치가 아래로 떨어지지 않으면 고장난 것이다.","category":"기출문제","difficulty":"중"},{"id":3,"question":"내가 감전되었을 때 옳지 않은 행동은?","choices":["감전의 원인이 된 제품에 다시 손을 대지 않는다.","빨리 주위 어른들에게 알린다.","화상을 입었다면 흐르는 물로 화상 부위를 식힌다.","가벼운 감전이라면 후에 이상이 있을 때 병원에 간다."],"answer":3,"explanation":"p.14 // 가벼운 감전으로도 깊은 상처가 생길 수 있으므로 병원에 가야 한다.","category":"기출문제","difficulty":"중"},{"id":4,"question":"우리 가정에서 사용하는 가스 원료의 종류가 아닌 것은?","choices":["액화수소가스","액화천연가스","액화석유가스","부탄가스"],"answer":0,"explanation":"p.28 // 가정에서 사용하는 가스 원료는 액화석유가스,액화천연가스,부탄가스 등이다.","category":"기출문제","difficulty":"중"},{"id":5,"question":"가스에 대한 설명으로 ( ) 안에 들어갈 내용이 순서대로 옳게 적은 것은? ( ) 도시가스회사에서 땅 속에 배관을 묻어 공급하는 도시가스는 주로 ( )이며, 이 가스의 주 성분은 ( )이다. 일부 지역이나 음식점 등에서는 가스통 형태로 ( )을 사용하기도 한다.","choices":["LPG, 부탄가스, LNG","LNG, 부탄가스, LPG","LNG, 메탄가스, LPG","LPG, 메탄가스, LNG"],"answer":2,"explanation":"p.16 // 땅 속에 배관을 묻어 공급하는 LNG의 주성분은 메탄가스이며, 가스통 형태로 공급하는 가스는 LPG이다.","category":"기출문제","difficulty":"중"},{"id":6,"question":"분자량이 가장 큰 것은?","choices":["프로판가스","부탄가스","메탄가스","공기"],"answer":1,"explanation":"p.19 // 공기 29, 프로판가스 44, 부탄가스 58, 메탄가스 16","category":"기출문제","difficulty":"중"},{"id":7,"question":"유류의 특징이 아닌 것은?","choices":["불이 붙기 쉽다.","물로는 불을 끄기 어렵다.","물보다 가볍고, 물과 혼합되지 않는다.","유류에서 발생된 유증기는 공기보다 가볍다."],"answer":3,"explanation":"p.21 // 유류에서 발생된 유증기는 공기보다 무겁다.","category":"기출문제","difficulty":"중"},{"id":8,"question":"집에서 튀김요리를 하던 중 불이 붙었을 때에 사용해야 하는 소화기는?","choices":["A급 소화기","B급 소화기","C급 소화기","K급 소화기"],"answer":3,"explanation":"p.34 // 기름이 튈 수 있기 때문에 물이 아닌 K급 소화기를 사용한다.","category":"기출문제","difficulty":"중"},{"id":9,"question":"화재가 나서 실내에 갇혔을 때 하는 행동으로 옳은 것은?","choices":["소리를 질러 외부에 알리고, 구조를 기다린다.","내가 뛸 수 있는 높이라고 생각되면, 창 밖으로 뛰어내린다.","다른 곳에서 화재가 발생했다면 얼른 문을 열어서 뛰어 나간다.","연기가 창문이나 문틈으로 새어들 때에는 얼른 틈을 더 크게 만들어 빠져나간다."],"answer":0,"explanation":"p.36 // 함부로 창 밖으로 뛰어내리면 안되고, 다른 곳에서 발생했다면 나가기 전에 문을 손으로 살짝만져보고 뜨겁다면 문을 열지 않는다. 연기가 문틈으로 새어나오면 수건 등에 물을 적셔 틈을 막는다.","category":"기출문제","difficulty":"중"},{"id":10,"question":"연기 속을 피난 할 때 수건을 사용해야 하는 이유에 대한 설명으로 옳은 것은?","choices":["수건에 포함되어 있는 물로 인해 호흡이 편안해지게 만든다.","젖은 수건을 몇 겹 포개서 입과 코에 대고 숨을 쉬면 수건은 필터 기능을 한다.","마른 수건 4겹이면 연기를 20% 정도 제거할 수 있다.","마른 수건 8겹이면 자극성가스와 일산화탄소 모두 제거할 수 있다."],"answer":1,"explanation":"p.41 // 수건에 포함되어 있는 물은 호흡저항이 되며 호흡이 곤란해진다. 4겹이면 40% 정도 제거할 수 있다. 8겹이면 자극성가스는 제거할 수 있으나 일산화탄소는 제거할 수 없다.","category":"기출문제","difficulty":"중"},{"id":11,"question":"화상을 입었다면 해야 하는 행동으로 알맞지 않은 것은?","choices":["물집은 가능하면 터트리지 않는다.","큰 화상이 아니라면, 10-15분정도 찬물에 담근다.","탈지면을 붙여 응급처치를 한 후 병원에 간다.","수돗물을 세게 틀면 손상을 입을 수 있으므로 세게 틀지 않는다."],"answer":2,"explanation":"p.43 // 탈지면은 상처에 달라붙기 때문에 화상에는 절대 사용하면 안된다.","category":"기출문제","difficulty":"중"},{"id":12,"question":"심폐소생술에 대해 바르게 설명한 것은?","choices":["심정지가 발생했을 때 아무런 조치를 취하지 않으면 10분 내에 뇌손상이 일어날 수 있다.","심폐소생술을 하다가 119 구급대원이 도착하기 전 힘들면 잠시 쉬었다가 진행한다.","심폐소생술이 시행된 경우 소생률이 3배로 늘어나니 내 가족을 살린다는 마음으로 최선을 다해야 한다.","가슴압박 깊이는 1cm로 하며, 너무 깊게 가슴 압박하지 않아도 괜찮다."],"answer":2,"explanation":"p.44-45 // 심정지가 발생했을 때 아무조치하지 않으면 4-5분 내에 뇌손상이 일어난다. 119 구급대원이 도착할 때까지 쉬지 않고 심폐소생술을 해야 한다. 가슴압박 깊이는 5cm 너무 얕게 하면 소생이 어렵다.","category":"기출문제","difficulty":"중"},{"id":13,"question":"다음의 심폐소생술의 행동요령 중 가장 먼저 할 일은?","choices":["가슴압박 30회 시행: 가슴압박점을 찾아 30회 실시한다.","회복자세 : 옆으로 돌려 눕혀 기도가 막히는 것을 예방한다.","119 신고 및 AED 요청: 구체적으로 사람을 지목하여 요청한다.","기도개방 및 인공호흡 2회 시행: 환자의 기도를 개방하고 인공호흡을 실시한다."],"answer":2,"explanation":"p45 // 심폐소생술은 의식확인-119신고 및 AED요청-호흡확인-가슴압박 30회-기도개방 및 인공호흡2회-회복자세 취하기 6단계이다.","category":"기출문제","difficulty":"중"},{"id":14,"question":"압사 사고를 피하기 위한 행동요령으로 옳지 않은 것은?","choices":["답답하더라도 앞 사람을 밀지 않는다.","가방이 있는 경우에는 가방을 뒤로 매서 등을 보호한다.","넘어졌을 경우 몸을 웅크려서 중요 신체부위를 보호한다.","시끄러운 행사장에서 넘어졌을 때는 호루라기를 사용하면 효과적이다."],"answer":1,"explanation":"p49 // 가방이 있는 경우에는 가방을 앞으로 매서 안전한 자세를 유지한다.","category":"기출문제","difficulty":"중"},{"id":15,"question":"다음은 감지기에 대한 설명이다. 옳지 않은 것은?","choices":["감지기는 경보설비 중 하나이다.","감지기의 종류는 열감지기와 연기감지기가 있다.","천장에 설치되어 불이 난 것을 자동으로 감지한다.","정보를 발신기로 보내 벨이 울리도록 하는 기구이다."],"answer":3,"explanation":"p.50 // 정보를 수신기로 보내 벨이 울리도록 하는 기구이다.","category":"기출문제","difficulty":"중"},{"id":16,"question":"다음 자연재난이 발생했을 때 위험에 대처하는 행동요령으로 가장 알맞은 것은? ( ) 강과 하천의 물이 불어 넘치는 현상을 말합니다. 전 세계적으로 가장 많은 재난을 일으키는 자연재해입니다.","choices":["밀려온 물에 가까이 가지 않도록 주의한다.","외출시 소매가 긴 옷을 입고 보호용 안경을 착용한다.","피뢰침이 있는 건물로 대피한다.","학교에서는 운동장 가운데에 엎드린다."],"answer":0,"explanation":"p.87 // 홍수에 대한 설명이다. 2번 황사, 3번 낙뢰 4번 지진의 대피방법이다.","category":"기출문제","difficulty":"중"},{"id":17,"question":"소화기의 사용법 4단계 중 2번째 순서는?","choices":["안전핀을 뽑는다.","호스를 불쪽으로 향한다.","불을 향해 빗자루로 쓸 듯이 골고루 뿌린다.","소화기를 불이 난 곳으로 옮긴다."],"answer":0,"explanation":"p.56 // 소화기 사용법 순서이다.","category":"기출문제","difficulty":"중"},{"id":18,"question":"소화기의 관리법에 대한 설명으로 옳지 않은 것은?","choices":["통행에 지장을 주는 곳에 놓아서는 안된다.","습기가 적고 햇빛이 없는 서늘한 곳에 두어야 한다.","정상적으로 관리했더라도 5년이 경과하면 교체해야 한다.","소화기는 보기 쉽고 편리한 곳에 보관한다."],"answer":2,"explanation":"p.57 // 소화기는 정상적으로 관리했더라도 10년이 경과하면 교체해야 한다.","category":"기출문제","difficulty":"중"},{"id":19,"question":"피난기구의 특징이 아닌 것은?","choices":["피난사다리는 창문을 통해서 안전하게 내려갈 수 있게 만들었다.","구조대는 건물의 창에서 땅위로 설치하여 내려오게 한다.","미끄럼대는 건물의 창 또는 베란다에 미끄럼틀처럼 설치한다.","공기안전매트는 벨트를 가슴에 매며 자동으로 내려오게 한다."],"answer":3,"explanation":"p.61-62 // 벨트를 가슴에 매며 자동으로 내려오게 하는 피난기구는 완강기이다.","category":"기출문제","difficulty":"중"},{"id":20,"question":"지하상가 화재시 대피방법에 대해 틀린 설명을 하는 친구는?","choices":["주원: 지하상가 화재가 나면 화재경보기를 눌러야 해.","민용: 공기가 유입되는 방향으로 대피하면 위험해.","예슬: 우왕좌왕 하지 말고, 한 방향을 택하여 대피해야해.","이현: 열기가 급속하게 확산될 수 있으니 재빨리 나가야해."],"answer":1,"explanation":"p.65 // 공기가 유입되는 방향으로 대피해야 한다.","category":"기출문제","difficulty":"중"},{"id":21,"question":"건물 붕괴 징조가 아닌 것은?","choices":["건물 바닥이 갈라지거나 함몰될 때","마른하늘에 갑자기 천둥 치며 비가 올 때","벽이나 바닥에서 갈라지는 소리가 날 때","동물들이 갑자기 크게 짓거나 불안해할 때"],"answer":1,"explanation":"p.70 // 마른하늘에 갑자기 천둥치며 비가 올 때는 건물 붕괴 징조가 아니다.","category":"기출문제","difficulty":"중"},{"id":22,"question":"다음은 어떤 상황에 지켜야 할 사항인가? ( ) 규칙적으로 벽을 두드려서 구조 요원에게 나의 위치를 알린다. 구조될 수 있다는 희망을 가지고 체온이 떨어지지 않도록 한다. 먼지를 피하기 위해 마른 손수건으로 코와 입을 가린다.","choices":["건물 붕괴시 대피방법","물놀이 사고 발생시 대처방안","화학약품에 의한 화상 응급처치","붕괴된 건물에 갇힌 경우 대처방법"],"answer":3,"explanation":"p.71 // 다음은 붕괴된 건물에 갇힌 경우의 대처방법이다.","category":"기출문제","difficulty":"중"},{"id":23,"question":"파도가 갑자기 높아져 위험할 때 하는 행동이 아닌 것은?","choices":["큰 파도가 덮칠 때는 깊이 잠수할수록 안전하다.","체력이 다하여 지쳤을 때는 배영으로 파도에 몸을 맡긴다.","도와달라고 소리를 지르거나 손을 최대한 높이 들어 흔든다.","물을 다소 마시게 되더라도 편안한 상태를 유지해야 한다."],"answer":2,"explanation":"p.74 // 파도가 갑자기 높아져 위험할 때에는 1,2,4번의 방법을 사용한다.","category":"기출문제","difficulty":"중"},{"id":24,"question":"산행 중 산불 대처요령으로 올바르지 않은 것은?","choices":["산림청, 소방서 등 빠른 신고가 중요하다.","작은 산불은 외투, 흙으로 덮어 진화한다.","산불진행 방향에서 벗어나 산불보다 높은 장소로 대피한다.","대피하지 못했다면, 바람을 등지고 낮은 자세로 엎드린다."],"answer":2,"explanation":"p.82 // 산불진행 방향에서 벗어나 산불보다 낮은 장소로 대피해야 한다.","category":"기출문제","difficulty":"중"},{"id":25,"question":"다음 대피방법과 가장 관련 있는 자연재난은? ( ) ㈎ 피뢰침이 설치된 건물로 대피한다. ㈏ 물기가 있는 화장실에 가지 않는다. ㈐ 금속제품은 ( )를 맞을 수 있으므로 가까이 하지 않는다.","choices":["지진","낙뢰","태풍","홍수 안전지킴이 여러분! 재난예방을 늘 실천하세요."],"answer":1,"explanation":"p.86 // 낙뢰가 일어났을 때 대피방법이다.","category":"기출문제","difficulty":"중"}]},"expected":[{"id":1,"category":"불의 원리","difficulty":"중","question":"길라잡이에서 설명한 ‘불’의 뜻으로 가장 알맞은 것은?","choices":["물질이 산소와 결합해 열과 빛을 내며 타는 현상","물질이 물과 결합해 연기만 내는 현상","산소가 없어도 스스로 빛나는 현상","열이 없이 물질의 색만 변하는 현상"],"answer":0,"explanation":"불은 어떤 물질이 산소와 결합하여 열과 빛을 내면서 타는 현상입니다."},{"id":2,"category":"불의 원리","difficulty":"상","question":"불의 세 가지 요소를 모두 없애지 않고도 불을 끌 수 있는 이유는?","choices":["세 요소 중 하나만 없애도 연소가 계속되지 않기 때문","산소만 있으면 불이 저절로 꺼지기 때문","가연물은 불의 요소가 아니기 때문","모든 불은 시간이 지나면 바로 꺼지기 때문"],"answer":0,"explanation":"열(점화원), 산소, 가연물 중 어느 하나만 제거해도 불은 계속 타지 못합니다. 이것이 소화의 기본 원리입니다."},{"id":3,"category":"전기 안전","difficulty":"중","question":"전기제품의 플러그를 뽑는 가장 안전한 방법은?","choices":["전깃줄을 잡고 빠르게 당긴다","젖은 손으로 플러그를 잡는다","플러그 몸체를 잡고 뽑는다","콘센트에 물을 뿌린 뒤 뽑는다"],"answer":2,"explanation":"전깃줄을 당기면 피복이 벗겨져 감전·스파크·누전 위험이 있으므로 플러그 몸체를 잡아야 합니다."},{"id":4,"category":"전기 안전","difficulty":"상","question":"누전 차단기의 시험용 버튼을 눌렀는데 왼쪽 스위치가 아래로 떨어지지 않았다. 알맞은 판단은?","choices":["정상 작동한 것이다","고장 가능성이 있어 교체해야 한다","3개월 뒤 다시 확인한다","스위치를 계속 누르고 있는다"],"answer":1,"explanation":"시험용 버튼을 눌렀을 때 스위치가 떨어지지 않으면 고장 난 것이므로 어른에게 알려 교체해야 합니다. 매월 1회 이상 점검합니다."},{"id":5,"category":"가스 안전","difficulty":"상","question":"가스 누설 경보기의 설치 위치를 바르게 짝지은 것은?","choices":["LNG-바닥 30cm, LPG-천장 30cm","LNG-천장 30cm, LPG-바닥 30cm","둘 다 천장 한가운데","둘 다 창문 바로 옆"],"answer":1,"explanation":"LNG는 공기보다 가벼워 천장에서 30cm 이내, LPG는 공기보다 무거워 바닥에서 30cm 이내에 설치합니다."},{"id":6,"category":"가스 안전","difficulty":"중","question":"집에서 가스 냄새가 날 때 하면 안 되는 행동은?","choices":["가스가 새는 곳에서 피한다","어른이나 119에 알린다","창문과 출입문을 열어 환기한다","전등 스위치를 켜서 새는 곳을 찾는다"],"answer":3,"explanation":"스위치를 켜거나 끌 때 생기는 전기불꽃으로 가스가 폭발할 수 있습니다. 전기기구와 라이터·성냥을 만지지 않습니다."},{"id":7,"category":"소화 원리","difficulty":"상","question":"모래나 담요로 타는 물체를 완전히 덮는 소화 방법은?","choices":["냉각소화","제거소화","질식소화","분해소화"],"answer":2,"explanation":"타는 물체를 덮어 산소 공급을 막는 방법은 질식소화입니다. 산소 농도가 약 15% 이하가 되면 불꽃이 꺼집니다."},{"id":8,"category":"화재 대응","difficulty":"중","question":"물을 사용하면 특히 위험한 화재를 바르게 묶은 것은?","choices":["종이와 나무 화재","기름과 전기 화재","천과 의류 화재","쓰레기와 낙엽 화재"],"answer":1,"explanation":"기름불에 물을 부으면 기름이 튀어 불이 번지고, 전기화재에 물을 사용하면 감전될 수 있습니다."},{"id":9,"category":"화재 대피","difficulty":"중","question":"화재 현장에서 밖으로 대피하며 출입문을 닫아야 하는 까닭은?","choices":["집 안을 어둡게 하려고","불길과 연기가 퍼지는 것을 줄이려고","소방관이 문을 찾지 못하게 하려고","다시 들어가기 쉽게 하려고"],"answer":1,"explanation":"문을 닫으면 불과 연기가 복도나 다른 공간으로 번지는 속도를 늦출 수 있습니다."},{"id":10,"category":"화재 대피","difficulty":"상","question":"연기 속에서 사용하는 수건에 관한 설명으로 옳은 것은?","choices":["젖은 수건은 일산화탄소를 완전히 제거한다","마른 수건 4겹은 연기를 약 40% 걸러낼 수 있다","물이 많을수록 호흡이 항상 편하다","수건만 있으면 자세를 낮출 필요가 없다"],"answer":1,"explanation":"길라잡이는 마른 수건 4겹이 연기를 약 40% 제거할 수 있다고 설명합니다. 젖은 수건이나 마른 수건 모두 일산화탄소는 제거하지 못합니다."},{"id":11,"category":"화재 대응","difficulty":"하","question":"옷에 불이 붙었을 때의 행동 순서는?","choices":["달리기-점프-구르기","멈추기-엎드리기-구르기","물 찾기-달리기-외치기","옷 벗기-서 있기-뛰기"],"answer":1,"explanation":"STOP(멈추기) → DROP(엎드리기) → ROLL(얼굴을 가리고 구르기) 순서로 행동합니다."},{"id":12,"category":"심폐소생술","difficulty":"상","question":"심정지 환자에게 아무 조치를 하지 않을 경우 뇌손상이 시작될 수 있는 시간은?","choices":["약 30초","약 4~5분","약 20분","약 1시간"],"answer":1,"explanation":"심정지 초기 4~5분의 대응이 매우 중요하며, 목격자가 심폐소생술을 하면 소생률이 3배 이상 높아질 수 있습니다."},{"id":13,"category":"심폐소생술","difficulty":"상","question":"길라잡이에 나온 가슴압박 방법으로 옳은 것은?","choices":["깊이 약 1cm, 분당 30회","깊이 약 3cm, 분당 60회","깊이 약 5cm, 분당 100~120회","깊이 약 10cm, 분당 200회"],"answer":2,"explanation":"가슴압박은 약 5cm 깊이로 분당 100~120회 속도로 실시합니다. 가슴압박과 인공호흡의 비율은 30:2입니다."},{"id":14,"category":"자동심장충격기","difficulty":"상","question":"AED 패드의 올바른 부착 위치는?","choices":["두 장 모두 배 위","오른쪽 쇄골 아래와 왼쪽 젖꼭지 아래 중간 겨드랑이선","두 장 모두 등 한가운데","왼쪽과 오른쪽 손목"],"answer":1,"explanation":"패드 1은 오른쪽 쇄골 아래, 패드 2는 왼쪽 젖꼭지 아래의 중간 겨드랑이선에 붙입니다."},{"id":15,"category":"압사 예방","difficulty":"중","question":"사람이 많이 몰린 곳에서 유지해야 할 자세는?","choices":["가방을 뒤로 메고 팔을 내린다","손을 가슴 앞에 모으고 가방은 앞으로 멘다","사람의 흐름을 거슬러 달린다","앞사람을 밀어 공간을 만든다"],"answer":1,"explanation":"손은 가슴 앞에 모아 호흡 공간을 지키고, 가방은 앞으로 메며 사람들의 이동 방향을 따릅니다."},{"id":16,"category":"소방시설","difficulty":"상","question":"주택용 소방시설의 설치 기준으로 옳은 것은?","choices":["감지기-집 전체 1개, 소화기-마을 1개","감지기-구획된 실마다, 소화기-세대별·층별 1개 이상","둘 다 옥상에만","감지기-화장실에만, 소화기-침대 아래"],"answer":1,"explanation":"단독경보형 감지기는 구획된 실마다, 소화기는 세대별·층별 1개 이상 설치합니다."},{"id":17,"category":"소화기","difficulty":"상","question":"소화기 압력게이지 바늘의 색과 상태가 바르게 연결된 것은?","choices":["초록색-정상","노란색-압력이 지나치게 높음","빨간색-압력 부족","모든 색-정상"],"answer":0,"explanation":"초록색은 정상, 노란색은 압력 부족, 빨간색은 압력이 지나치게 높은 상태입니다."},{"id":18,"category":"소화기","difficulty":"중","question":"소화기 사용 순서로 옳은 것은?","choices":["안전핀-이동-분사-호스","이동-안전핀-호스-손잡이 분사","호스-분사-안전핀-이동","분사-이동-호스-안전핀"],"answer":1,"explanation":"불 가까이로 옮기기 → 안전핀 뽑기 → 호스를 불 쪽으로 향하기 → 손잡이를 움켜쥐고 분사하기 순서입니다."},{"id":19,"category":"소화기","difficulty":"상","question":"정상적으로 관리한 분말소화기의 내용연수와 연장 기준은?","choices":["5년, 연장 불가","7년, 매년 연장","10년, 성능확인 후 1회에 한해 3년 연장","20년, 검사 없이 계속 사용"],"answer":2,"explanation":"분말소화기는 10년이 지나면 교체합니다. 성능확인 검사를 통과하면 1회에 한하여 3년 연장할 수 있습니다."},{"id":20,"category":"아파트 화재","difficulty":"중","question":"다른 집에서 불이 났지만 우리 집으로 불길과 연기가 들어오지 않을 때 알맞은 행동은?","choices":["무조건 계단으로 뛰어나간다","창문과 현관문을 닫고 실내에서 안내를 기다린다","엘리베이터를 타고 내려간다","창문을 모두 열어 확인한다"],"answer":1,"explanation":"2026 길라잡이는 ‘불나면 살펴서 대피’를 강조합니다. 집 안으로 연기와 불이 들어오지 않으면 문을 닫고 실내 대기하며 안내에 따르는 편이 안전할 수 있습니다."},{"id":21,"category":"아파트 화재","difficulty":"상","question":"복도와 계단에 짙은 연기가 가득해 대피하기 어려울 때 이용할 수 없는 것은?","choices":["대피공간","하향식 피난구","경량칸막이","승객용 엘리베이터"],"answer":3,"explanation":"대피공간, 하향식 피난구, 경량칸막이를 이용하거나 문틈을 막고 119에 구조를 요청합니다. 엘리베이터는 이용하지 않습니다."},{"id":22,"category":"하임리히법","difficulty":"중","question":"음식물이 기도에 걸렸지만 스스로 힘차게 기침할 수 있다면?","choices":["바로 배를 세게 누른다","입에 손가락을 깊이 넣는다","기침을 계속하도록 돕고 상태를 살핀다","물을 억지로 많이 마시게 한다"],"answer":2,"explanation":"스스로 기침할 수 있으면 억지로 등을 두드리거나 배를 누르지 않고 기침을 계속하도록 돕습니다."},{"id":23,"category":"하임리히법","difficulty":"상","question":"말도 못 하고 기침도 못 하는 기도폐쇄 환자에게 먼저 시행하는 처치는?","choices":["양쪽 어깨뼈 사이를 약 5번 두드린다","바로 눕혀 물을 마시게 한다","배를 20번 연속 누른다","환자를 혼자 둔다"],"answer":0,"explanation":"환자를 앞으로 숙이게 하고 손바닥 아래쪽으로 양쪽 어깨뼈 사이를 약 5번 두드립니다. 나오지 않으면 하임리히법을 실시합니다."},{"id":24,"category":"하임리히법","difficulty":"상","question":"하임리히법에서 두 손을 놓는 위치는?","choices":["목과 턱 사이","배꼽과 명치 사이 가운데","가슴의 왼쪽 위","등의 한가운데"],"answer":1,"explanation":"한 손은 주먹을 쥐고 엄지 쪽을 배꼽과 명치 사이에 댄 뒤 다른 손으로 감싸 안쪽·위쪽으로 밀어 올립니다."},{"id":25,"category":"하임리히법","difficulty":"중","question":"하임리히법을 하면 안 되는 대상은?","choices":["성인","초등학생","1세 미만 아기","기침을 못 하는 청소년"],"answer":2,"explanation":"1세 미만 아기에게는 일반적인 하임리히법을 하면 안 됩니다. 즉시 어른을 부르고 119에 신고합니다."},{"id":26,"category":"하임리히법","difficulty":"상","question":"기도폐쇄 환자가 의식을 잃고 쓰러졌을 때 해야 할 일은?","choices":["하임리히법을 계속한다","혼자 두고 기다린다","하임리히법을 멈추고 119 신고와 심폐소생술 도움을 요청한다","앉힌 뒤 물을 마시게 한다"],"answer":2,"explanation":"환자가 쓰러지면 하임리히법을 중단하고 119에 신고하며, 어른에게 심폐소생술을 해 달라고 요청합니다."},{"id":27,"category":"승강기 안전","difficulty":"하","question":"승강기가 갑자기 멈췄을 때 가장 먼저 해야 할 행동은?","choices":["문을 힘으로 연다","비상통화장치(인터폰)를 누른다","승강기 안에서 뛴다","천장으로 탈출한다"],"answer":1,"explanation":"가장 먼저 인터폰을 눌러 갇힌 사실, 인원수, 다친 사람 여부를 알리고 구조를 기다립니다."},{"id":28,"category":"승강기 안전","difficulty":"상","question":"인터폰이 function questionHtml(q,student,hideExplanation=false){const preview=inPreview();if(preview)return '<section class="card preview-card"><div class="meta"><span>'+safe(q.category)+'</span><i>Q'+(room.currentIndex+1)+' / '+room.order.length+'</i></div><h2>'+safe(q.question)+'</h2>'+(q.context?'<div class="context">'+safe(q.context)+'</div>':'')+'<div class="question-preview"><span>문제를 먼저 읽어보세요</span><b>3초 후 보기가 나타납니다</b><strong id="previewCount">'+previewSecondsLeft()+'</strong></div></section>';const mine=answers.find(a=>a.uid===uid&&a.index===room.currentIndex),submitted=!!mine,choice=student?(mine?.choice??localChoice):localChoice,expired=secondsLeft()<=0,canPick=student&&!submitted&&!room.revealed&&!expired&&room.status==='question'&&!room.paused;const choices=q.choices.map((c,i)=>'<button class="choice '+(choice===i?'selected ':'')+(room.revealed&&i===q.answer?'correct ':'')+(room.revealed&&choice===i&&i!==q.answer?'wrong ':'')+'" '+(canPick?'onclick="pickLive('+i+')"':'')+'><b>'+nums[i]+'</b><span>'+safe(c)+'</span>'+(room.revealed&&i===q.answer?'<em>정답</em>':'')+'</button>').join(''),submit=student&&room.status==='question'&&!submitted?'<button id="liveSubmit" class="submit" '+(choice===null||expired||room.paused?'disabled':'')+' onclick="submitLive()">'+(room.paused?'일시정지 중':expired?'제출 시간이 끝났어요':'답안 제출하기')+'</button>':'';return '<section class="card"><div class="meta"><span>'+safe(q.category)+'</span><i>Q'+(room.currentIndex+1)+' / '+room.order.length+'</i></div>'+(room.status==='question'?'<div style="display:flex;justify-content:flex-end;margin-bottom:12px">'+timerHtml()+'</div>':'')+'<h2>'+safe(q.question)+'</h2>'+(q.context?'<div class="context">'+safe(q.context)+'</div>':'')+'<div class="choices '+(student?'student-choices':'')+'">'+choices+'</div>'+submit+(room.revealed&&!hideExplanation?'<div class="explain"><h3>💡 왜 이게 정답일까요?</h3><p>'+safe(q.explanation)+'</p></div>':'')+'</section>'}
function hostView(){if(!room)return;const url=joinUrl(roomCode),qr='https://api.qrserver.com/v1/create-qr-code/?size=230x230&data='+encodeURIComponent(url);if(room.status==='lobby'){shell('학생 입장을 기다리고 있어요','<div class="live-grid"><div><img class="qr" src="'+qr+'" alt="학생 입장 QR코드"><div class="qr-room-code"><span>방 코드</span><b>'+roomCode+'</b></div><p class="copy-link">'+safe(url)+'</p></div><div><p>방 코드</p><div class="room-code">'+roomCode+'</div><h3>참여 학생 <b>'+players.length+'</b>명</h3>'+(players.length?managementHtml():'<span class="tiny">아직 입장한 학생이 없습니다.</span>')+'<p class="tiny">문제당 최대 1,000점이며 빠르게 맞힐수록 높은 점수를 받습니다. 3연속 정답 +100점, 5연속부터 +200점 보너스가 있습니다.</p><div class="live-actions"><button class="live-btn orange" '+(!players.length?'disabled':'')+' onclick="startRoom()">첫 문제 시작</button><button class="live-btn ghost" onclick="endRoom()">방 종료</button></div></div></div>');return}const rows=rankingRows(),previous=rankingRows(true);if(room.status==='ended'){shell('최종 결과 TOP 10',podiumHtml(rows)+rankListHtml(rows.slice(0,10),previous)+specialAwardsHtml(rows)+'<div class="live-actions"><button class="live-btn ghost" onclick="endRoom()">방 닫기</button></div>');return}if(room.status==='ranking'){shell('실시간 순위 TOP 10','<p class="tiny">이번 문제 점수가 반영되며 순위가 오르내립니다.</p>'+rankListHtml(rows.slice(0,10),previous)+'<div class="live-actions"><button class="live-btn orange" onclick="nextRoom()">'+(room.currentIndex+1>=room.order.length?'최종 결과':'다음 문제')+'</button><button class="live-btn ghost" onclick="endRoom()">방 종료</button></div>');return}const q=currentQ(),cur=answers.filter(a=>a.index===room.currentIndex),counts=[0,1,2,3].map(i=>cur.filter(a=>a.choice===i).length),max=Math.max(1,...counts),bars=counts.map((n,i)=>'<div class="barrow '+(room.revealed&&i===q.answer?'correct':'')+'"><span>'+nums[i]+'</span><div class="bar"><i style="width:'+(n/max*100)+'%"></i></div><span>'+n+'명</span></div>').join('');if(room.status==='question'&&!inPreview()&&room.autoReveal&&players.length&&cur.length>=players.length&&autoClosedIndex!==room.currentIndex){autoClosedIndex=room.currentIndex;playHostSound('reveal');confetti();queueMicrotask(()=>updateDoc(doc(db,'rooms',roomCode),{revealed:true,status:'revealed',paused:false}))}const stats='<div class="live-stats"><div class="statbox"><b>'+players.length+'</b>참여</div><div class="statbox"><b>'+cur.length+'</b>제출</div><div class="statbox"><b>'+(players.length-cur.length)+'</b>미제출</div><div class="statbox"><b>'+(room.revealed?cur.filter(a=>a.choice===q.answer).length:'-')+'</b>정답</div></div>',paused=room.paused?'<div class="student-status">⏸ 일시정지 중입니다.</div>':'',actions=inPreview()?'<div class="student-status">📖 3초 동안 문제를 읽어보세요.</div>':room.revealed?'<button class="live-btn orange" onclick="showScores()">점수 확인하기</button>':room.status==='closed'?'<button class="live-btn orange" onclick="revealRoom()">정답·해설 공개</button>':'<button class="live-btn orange" onclick="revealRoom()">정답·해설 공개</button>'+teacherControls();shell('문제 '+(room.currentIndex+1),paused+stats+(room.revealed?'<div class="reveal-grid"><div class="reveal-question">'+questionHtml(q,false,true)+'</div><aside class="reveal-side"><div class="explain"><div class="verdict">정답은 '+nums[q.answer]+'번이에요! 🎉</div><h3>💡 왜 이게 정답일까요?</h3><p>'+safe(q.explanation)+'</p></div><h3>📊 보기별 응답 인원</h3><div class="bars">'+bars+'</div></aside></div>':questionHtml(q,false))+'<div class="live-actions reveal-actions">'+actions+'<button class="live-btn ghost" onclick="endRoom()">방 종료</button></div>')}
function studentView(){if(!room)return;const self=players.find(p=>p.uid===uid),kicked=room.kicked?.[uid],kickTime=typeof kicked==='number'?kicked:0,rejoined=Math.max(rejoinAt,self?.rejoinedAt||0);if(kicked&&rejoined<=kickTime){cleanup();shell('방에서 퇴장되었습니다','<div class="waiting"><div class="big">🚪</div><p>이름을 확인한 뒤 같은 방 코드로 다시 입장할 수 있어요.</p><button class="live-btn orange" onclick="showJoin(\''+safe(roomCode)+'\')">다시 입장하기</button></div>');return}if(!self){shell('입장 정보를 확인하고 있어요','<div class="waiting"><div class="big">⏳</div><p>이름과 아바타를 불러오는 중입니다.</p><button class="live-btn ghost" onclick="refreshRoomState()">다시 확인하기</button></div>');return}if(room.status==='lobby'){const me=self;shell('입장 완료!','<div class="waiting">'+avatarHtml(me,true)+'<h2>'+safe(displayName(me))+'</h2><h2>선생님이 시작할 때까지 기다려 주세요.</h2><p>'+players.length+'명이 함께 기다리고 있어요.</p><button class="live-btn ghost" onclick="refreshRoomState()">화면 동기화</button></div>');return}const me=self,rows=[...players].sort((a,b)=>(b.score||0)-(a.score||0)||(b.correct||0)-(a.correct||0)),rank=Math.max(1,rows.findIndex(p=>p.uid===uid)+1),summary='<div class="live-stats"><div class="statbox"><b>'+(me.correct||0)+'</b>맞힌 문제</div><div class="statbox"><b>'+(me.answered||0)+'</b>푼 문제</div><div class="statbox"><b>'+(me.score||0).toLocaleString()+'</b>총점</div><div class="statbox"><b>'+rank+'</b>순위</div></div>';if(room.status==='ended'){syncStudentScore();shell('나의 최종 결과','<div class="waiting student-profile">'+avatarHtml(me,true)+'<h2>'+safe(me.name||'안전 지킴이')+'</h2>'+summary+'</div>');return}if(room.status==='ranking'){syncStudentScore();shell('나의 현재 점수','<div class="student-identity">'+avatarHtml(me,true)+'<h2>'+safe(me.name||'안전 지킴이')+'</h2></div>'+summary+'<div class="waiting"><div class="big">📈</div><h2>순위가 반영됐어요!</h2><p>선생님이 다음 문제를 시작할 때까지 기다려 주세요.</p></div>');return}const q=currentQ(),mine=answers.find(a=>a.index===room.currentIndex),choice=mine?.choice??localChoice,point=mine?answerPoints(mine):0;let status='';if(room.revealed)status=mine?'<div class="student-status '+(mine.choice===q.answer?'ok':'no')+'">'+(mine.choice===q.answer?'정답이에요! +'+point.toLocaleString()+'점 🎉':'아쉬워요. 이번 문제는 0점이에요.')+'</div>':'<div class="student-status no">제한 시간 안에 제출하지 못했어요. 이번 문제는 0점이에요.</div>';else if(room.status==='closed')status='<div class="student-status">제출이 마감되었습니다. 정답 공개를 기다려요.</div>';else if(mine)status='<div class="student-status">답안 제출 완료! 정답 공개를 기다려요.</div>';else if(localChoice!==null)status='<div class="student-status">'+nums[localChoice]+'번을 선택했어요. 아래 제출 버튼을 눌러 주세요.</div>';const total='<div class="live-stats"><div class="statbox"><b>'+(me.correct||0)+'</b>현재 정답</div><div class="statbox"><b>'+(me.score||0).toLocaleString()+'</b>누적 점수</div><div class="statbox"><b>'+rank+'</b>현재 순위</div><div class="statbox"><b>'+players.length+'</b>참여</div></div>';shell('문제 '+(room.currentIndex+1),total+questionHtml(q,true)+status);syncStudentScore()}
function renderLive(){if(!room)return;syncBgm();host?hostView():studentView()}

setInterval(updateCountdown,250);addEventListener('visibilitychange',()=>{if(!document.hidden&&roomCode)refreshRoomState()});addEventListener('focus',()=>{if(roomCode)refreshRoomState()});

</script>
